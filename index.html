<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORÇA 92">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>FORÇA 92 • Treino</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07090b; --bg2:#0d1115; --card:#12171c; --card2:#181e24; --line:#262e36; --line2:#36404a;
  --txt:#f3f4f6; --mut:#9aa3ad; --mut2:#6f7883;
  --y:#ffc800; --y2:#ffdb3d; --ydim:#3a3115; --ok:#7fd67a; --red:#ff8a80;
  --head:'Oswald','Arial Narrow',system-ui,sans-serif;
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse 120% 28% at 50% -6%,#232a31 0,transparent 80%),var(--bg);color:var(--txt);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom));overflow-x:hidden;min-height:100vh}
body.timing{padding-bottom:calc(var(--tabh) + 86px + env(safe-area-inset-bottom))}
h1,h2,h3,.head{font-family:var(--head);font-weight:600;letter-spacing:.2px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:11px;padding:12px 14px;font-weight:700;background:var(--card2);color:var(--txt)}
button:active{transform:scale(.98)}
.btn-y{background:linear-gradient(135deg,var(--y2),var(--y));color:#111}
.btn-o{background:transparent;border:1.5px solid var(--y);color:var(--y)}
.btn-g{background:#232b33;color:var(--txt);border:1px solid var(--line2)}
.btn-d{background:transparent;border:1px solid #5a2f2f;color:var(--red)}
.btn-sm{padding:8px 11px;font-size:13px;border-radius:9px}
.w100{width:100%}
input,select,textarea{width:100%;min-width:0;background:#1b222a;border:1px solid var(--line2);border-radius:10px;padding:11px;font-size:16px}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);outline-offset:0;border-color:transparent}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px}
.muted{color:var(--mut)} small{color:var(--mut)}
.hidden{display:none!important}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(9,12,15,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid #2b2a1a;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:42px;flex:0 0 auto}
.brand h1{font-size:25px;line-height:1;font-weight:700;letter-spacing:-.3px}
.brand h1 b{color:var(--y)}
.brand h1{white-space:nowrap}
.brand .tag{font-size:9px;letter-spacing:1.6px;color:#cfd3d8;margin-top:3px;font-family:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .grow{flex:1;min-width:0}
.syncpill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);border:1px solid var(--line2);padding:6px 9px;border-radius:20px;background:#11161b;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2);flex:0 0 auto}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--y)} .dot.err{background:var(--red)}

main{max-width:720px;margin:0 auto;padding:14px 12px}
.card{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 2px 12px}
.pagehead h2{font-size:26px;text-transform:uppercase}
.pagehead small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--y);font-family:var(--head)}
.badge{display:inline-block;background:var(--ydim);color:var(--y);font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;letter-spacing:.3px}
.badge.solid{background:var(--y);color:#111}
.note{border-left:3px solid var(--y);background:#1d1b12;padding:10px 12px;border-radius:0 10px 10px 0;font-size:13px;color:#e7e3cc;margin-bottom:12px}

/* day strip */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.day{padding:10px 2px 9px;border-radius:12px;background:#151b21;border:1px solid var(--line);text-align:center}
.day b{display:block;font-family:var(--head);font-size:19px;font-weight:600}
.day span{display:block;font-size:10px;font-weight:600;color:var(--mut);line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.sel{background:linear-gradient(135deg,var(--y2),var(--y));border-color:var(--y);color:#111;box-shadow:0 4px 16px #ffc80026}
.day.sel span{color:#2a2300}
.day.next:not(.sel){border-color:#6b5a14}
.session{border-top:2px solid var(--y)}
.session h3{font-size:20px}
.progress{height:6px;background:#242b33;border-radius:6px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--y2));border-radius:6px;transition:width .25s}

/* exercise */
.ex{scroll-margin-top:90px;padding:0;overflow:hidden}
.ex-top{display:flex;gap:12px;padding:12px;align-items:center}
.ex-thumb{width:92px;height:70px;border-radius:10px;object-fit:cover;background:#1d242b;flex:0 0 auto;border:1px solid var(--line2)}
.ex-top .t{flex:1;min-width:0}
.ex-num{font-family:var(--head);font-size:11px;letter-spacing:1.6px;color:var(--y)}
.ex-name{font-family:var(--head);font-size:19px;font-weight:600;line-height:1.15;margin:2px 0 4px}
.ex-meta{font-size:12px;color:var(--mut)}
.ex.done .ex-num::after{content:'  ✓ CONCLUÍDO';color:var(--ok)}
.ex-body{padding:0 12px 12px}
.last{font-size:12.5px;background:#151b20;border:1px dashed #3a4450;border-radius:10px;padding:8px 10px;color:#cfd5db;margin-bottom:8px}
.last b{color:var(--y)}
.hint{font-size:12px;color:var(--ok);margin-top:4px}
.sethead,.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 52px;gap:7px;align-items:center}
.sethead{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.6px;text-align:center;margin:10px 0 4px}
.set{margin:6px 0}
.setn{font-family:var(--head);font-size:18px;text-align:center;color:#d8dde2}
.set input{text-align:center;font-size:18px;font-weight:700;padding:10px 4px;min-height:48px;background:#20272f}
.set input::placeholder{color:#59636e;font-weight:500}
.chk{width:100%;height:48px;border-radius:10px;border:1.5px solid #4a5560;background:#1a2027;display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;opacity:0}
.chk.on{background:var(--y);border-color:var(--y)}
.chk.on svg{opacity:1}
.set.isdone input{border-color:#4e4415;background:#221f12}
.exbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details.how{background:#171d23;border-radius:10px;padding:9px 11px;margin:8px 0;font-size:13px}
details.how summary{color:var(--y);font-weight:700;cursor:pointer;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:'▸ ';}
details.how[open] summary::before{content:'▾ ';}
details.how p{margin:8px 0 0;color:#d4d9de;line-height:1.5}

/* photos */
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.photos.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.ph{position:relative;border-radius:10px;overflow:hidden;background:#1d242b;border:1px solid var(--line2);aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px}
.ph.mine span{background:var(--y);color:#111}
.photo-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.credit{font-size:10.5px;color:var(--mut2)}

/* finish */
.finish h3{font-size:20px}
.big{width:100%;padding:16px;font-size:17px;font-family:var(--head);letter-spacing:.6px;text-transform:uppercase;margin-top:10px}

/* timer */
.timer{position:fixed;left:10px;right:10px;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom));z-index:30;max-width:700px;margin:0 auto;
  background:#14191e;border:1.5px solid var(--y);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px #000a}
.timer .clock{cursor:pointer;font-family:var(--head);font-size:34px;font-weight:600;min-width:84px;text-align:center;color:var(--y);font-variant-numeric:tabular-nums}
.timer .lbl{flex:1;font-size:11px;color:var(--mut);line-height:1.2}
.timer.over{border-color:var(--ok)} .timer.over .clock{color:var(--ok)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,13,16,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid #33321f;padding:6px 4px calc(6px + env(safe-area-inset-bottom));height:calc(var(--tabh) + env(safe-area-inset-bottom))}
nav.tabs button{background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:#aeb6be;border-radius:8px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--y)}

/* history */
.hist-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hist-head h3{font-size:18px}
.kv{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px}
.kv b{color:var(--txt)}
.hist-ex{padding:8px 0;border-top:1px solid var(--line)}
.hist-ex:first-child{border-top:0}
.hist-ex strong{font-size:14px}
.edit-set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center;margin:5px 0}
.edit-set input{padding:8px 4px;text-align:center}
.edit-set input[type=checkbox]{width:22px;height:22px;accent-color:var(--y)}

/* library */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:#171d23;border:1px solid var(--line2);font-size:13px;font-weight:600}
.chip.on{background:var(--y);color:#111;border-color:var(--y)}
.lib-item{display:flex;gap:11px;align-items:center;padding:10px;border-radius:13px;background:#12171c;border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;font-weight:500}
.lib-item img{width:84px;height:62px;border-radius:9px;object-fit:cover;background:#1d242b;flex:0 0 auto}
.lib-item .t{flex:1;min-width:0}
.lib-item strong{display:block;font-size:14.5px}
.lib-item .g{font-size:12px;color:var(--y);font-weight:700}
.lib-item .chev{color:var(--mut);font-size:20px}
.lib-open{background:#12171c;border:1px solid #4a3f12;border-radius:13px;padding:12px;margin:-4px 0 10px}

/* evolution */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 4px;font-size:14px;background:#151b21;border:1px solid var(--line)}
.seg button.on{background:var(--y);color:#111;border-color:var(--y)}
.stat{background:#151b21;border:1px solid var(--line);border-radius:13px;padding:11px}
.stat small{display:block;font-size:11px}
.stat b{display:block;font-family:var(--head);font-size:26px;font-weight:600;line-height:1.1;margin-top:3px}
.stat b i{font-style:normal;font-size:14px;color:var(--mut)}
.stat em{font-style:normal;font-size:12px;font-weight:700}
.up{color:var(--ok)} .down{color:var(--red)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.goalbar{height:10px;background:#242b33;border-radius:8px;overflow:hidden;margin:8px 0 4px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--y2))}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--mut);font-weight:600;font-size:11px}

/* câmera / check-in */
.cam{position:fixed;inset:0;z-index:60;background:#050607;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));gap:8px;overflow-y:auto}
.cam-top{display:flex;justify-content:space-between;align-items:center}
.cam-top b{font-size:22px;color:var(--y)}
.cam-dots{display:flex;gap:5px}.cam-dots i{flex:1;height:4px;border-radius:3px;background:#2a3038}.cam-dots i.ok{background:#8a7420}.cam-dots i.on{background:var(--y)}
.cam-stage{position:relative;flex:1;min-height:52vh;border-radius:14px;overflow:hidden;background:#111}
.cam-stage video,.cam-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam-stage .mirror{transform:scaleX(-1)}
#camGhost{pointer-events:none}
#camShot{background:#111;z-index:2}
.cam-count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:120px;color:var(--y);text-shadow:0 4px 30px #000;z-index:3}
.cam-nolive{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mut);font-size:14px}
.cam-hint{margin:0;font-size:13px;color:#d6dbe0;text-align:center}
.cam-ghost{display:flex;align-items:center;gap:10px}.cam-ghost small{white-space:nowrap}.cam-ghost input{padding:0;border:0;background:none;accent-color:var(--y)}
.cam-btns{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cam-btns .btn-y,.cam-btns #camRetake{flex:1}
.shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid var(--y);padding:0;flex:0 0 auto;box-shadow:0 0 0 3px #000 inset}
.cam-form{background:#0f1317;border-radius:14px;padding:12px}
.seg5{grid-template-columns:repeat(5,1fr)}.seg5 button{font-size:12.5px;padding:10px 2px}
.photos.one{grid-template-columns:1fr}
.ph.tall{aspect-ratio:3/4}.ph.tall img{object-fit:cover}
.ph.empty{display:grid;place-items:center}.ph.empty img{opacity:0}.ph.empty::after{content:'sem foto';color:var(--mut2);font-size:12px}
.lib-open .photos{grid-template-columns:repeat(2,minmax(0,1fr))}

/* sessão em andamento (cabeçalho) */
.sessbar{display:flex;align-items:center;gap:8px;margin-top:9px;padding:7px 8px 7px 11px;border-radius:12px;background:#1b1a10;border:1px solid #5a4b12}
.sessbar .live{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 #ff8a8099;animation:pulse 1.6s infinite;flex:0 0 auto}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff8a8088}70%{box-shadow:0 0 0 8px #ff8a8000}100%{box-shadow:0 0 0 0 #ff8a8000}}
@media (prefers-reduced-motion:reduce){.sessbar .live{animation:none}}
.sessbar .clock{font-family:var(--head);font-size:24px;font-weight:600;color:var(--y);font-variant-numeric:tabular-nums;line-height:1}
.sessbar .lbl{flex:1;min-width:0;font-size:11px;color:var(--mut);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessbar button{padding:7px 9px;font-size:12px;border-radius:8px}
.awake{background:#232b33;color:var(--mut);border:1px solid var(--line2)}
.awake.on{background:var(--ydim);color:var(--y);border-color:#6b5a14}
.startbox{display:grid;gap:8px;margin-top:12px}
.startbox .big{margin-top:0}
.extra-tag{background:#1f3a24;color:var(--ok)}
.exedit{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.optrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#1b222a;border:1px solid var(--line2);margin-top:8px;font-size:13.5px;cursor:pointer}
.optrow input{width:22px;height:22px;accent-color:var(--y);flex:0 0 auto;padding:0}
.addex{width:100%;padding:15px;border:1.5px dashed #6b5a14;background:transparent;color:var(--y);border-radius:14px;margin-bottom:12px;font-size:15px}
/* folha (sheet) */
.sheet-bg{position:fixed;inset:0;z-index:70;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:88vh;background:#12171c;border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#3a444e;margin:0 auto 10px}
.sheet .chips,.sheet>input,.sheet>.row,.sheet>p{flex:0 0 auto}
.sheet .list{overflow-y:auto;flex:1;min-height:0;margin-top:8px;display:grid;gap:7px;align-content:start}
.pick{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:#171d23;border:1.5px solid var(--line);text-align:left;font-weight:500;width:100%}
.pick img{width:64px;height:48px;border-radius:8px;object-fit:cover;background:#1d242b;flex:0 0 auto}
.pick .t{flex:1;min-width:0}.pick strong{display:block;font-size:14.5px}.pick small{font-size:12px}
.pick .box{width:26px;height:26px;border-radius:8px;border:1.5px solid #4a5560;display:grid;place-items:center;flex:0 0 auto}
.pick .box svg{width:18px;height:18px;opacity:0}
.pick.on{border-color:var(--y);background:#1f1d12}.pick.on .box{background:var(--y);border-color:var(--y)}.pick.on .box svg{opacity:1}
.pick.inday{opacity:.55}
.sheet-foot{display:flex;gap:8px;align-items:center;margin-top:10px}
.stepper{display:flex;align-items:center;gap:4px;background:#1b222a;border:1px solid var(--line2);border-radius:10px;padding:3px}
.stepper button{padding:8px 11px;background:none;font-size:16px}
.stepper span{min-width:62px;text-align:center;font-size:13px}
/* timer grande */
.bigtimer{position:fixed;inset:0;z-index:80;background:#050607;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.bigtimer .c{font-family:var(--head);font-weight:600;font-size:min(34vw,220px);line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.bigtimer.over .c{color:var(--ok)}
.bigtimer .l{color:var(--mut);font-size:15px;text-align:center}
.bigtimer .s{font-family:var(--head);color:#c9ced4;font-size:20px}
.bigtimer .row{gap:10px}
/* resumo do treino */
.summary{text-align:center}
.summary .dur{font-family:var(--head);font-size:64px;font-weight:600;color:var(--y);line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);opacity:0;z-index:50;background:#1d242b;border:1px solid var(--y);color:var(--txt);
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;max-width:92vw;box-shadow:0 10px 30px #000a;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:760px){main{padding:20px}.photos.big4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:400px){.brand .tag{font-size:8px;letter-spacing:1.1px}.syncpill{max-width:38vw;font-size:10px;padding:5px 8px}}
@media(max-width:360px){.brand h1{font-size:21px}.brand .tag{display:none}.sethead,.set{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 46px;gap:5px}.day b{font-size:16px}.day span{font-size:9px}.ex-thumb{width:74px;height:58px}}
</style>

const fresh = () => ({sessions:[],measurements:[],bodyScans:[],planHistory:[],drafts:{},library:[],plans:clone(PLANS),nextDay:0,planVersion:6});

function hasData(d){
  return !!d && Array.isArray(d.ex) && d.ex.some(e => filled(e.note) || (e.sets||[]).some(s => filled(s.kg) || filled(s.reps) || s.done));
}

// Normaliza qualquer estado (local, nuvem ou backup) para o formato V8, sem apagar registros.
function normalize(s){
  if(!s || typeof s !== 'object') s = fresh();
  for(const f of ['sessions','measurements','bodyScans','planHistory','library']) if(!Array.isArray(s[f])) s[f] = [];
  if(!s.drafts || typeof s.drafts !== 'object') s.drafts = {};
  if(!Array.isArray(s.plans) || !s.plans.length) s.plans = clone(PLANS);
  s.deleted ||= {}; s.deleted.sessions ||= {}; s.deleted.measurements ||= {}; s.deleted.drafts ||= {}; s.deleted.checkins ||= {};
  if(!Array.isArray(s.checkins)) s.checkins = [];
  s.photos ||= {};
  s.settings ||= {}; s.settings.rest ||= 90;
  if(typeof s.nextDay !== 'number' || s.nextDay < 0 || s.nextDay > 4) s.nextDay = 0;
  if((s.planVersion||0) < 6){
    s.planHistory.push({id:uuid(),date:new Date().toISOString(),reason:'Atualização ficha V6, histórico preservado',plans:clone(s.plans),version:s.planVersion||5});
    s.plans = clone(PLANS); s.planVersion = 6;
  }
  // V7 guardava rascunho por "data_dia" → V8 guarda um rascunho por dia da ficha (não some à meia-noite)
  for(const k of Object.keys(s.drafts)){
    const m = k.match(/^(\d{4}-\d{2}-\d{2})_(\d)$/);
    if(!m) continue;
    const d = s.drafts[k]; delete s.drafts[k];
    s.deleted.drafts[k] = Math.max(s.deleted.drafts[k]||0, 1);
    if(!hasData(d)) continue;
    const nk = 'active_'+m[2], cur = s.drafts[nk];
    if(!cur || String(d.date||m[1]) > String(cur.date||'')){ d.date ||= m[1]; d.day = +m[2]; d.updatedAt = d.updatedAt || 2; s.drafts[nk] = d; }
  }
  return s;
}

function maxMap(a={}, b={}){ const o = {...a}; for(const [k,v] of Object.entries(b)) o[k] = Math.max(o[k]||0, v||0); return o; }

// Mescla dois estados. "a" é o local. Nada é perdido, exceto o que foi explicitamente excluído (lápide).
function merge(a, b){
  a = normalize(clone(a)); b = normalize(clone(b));
  const out = clone(a);
  out.deleted = { sessions:maxMap(a.deleted.sessions,b.deleted.sessions), measurements:maxMap(a.deleted.measurements,b.deleted.measurements), drafts:maxMap(a.deleted.drafts,b.deleted.drafts), checkins:maxMap(a.deleted.checkins,b.deleted.checkins) };
  for(const f of ['sessions','measurements','bodyScans','planHistory','checkins']){
    const m = new Map();
    for(const it of [...b[f], ...a[f]]){ const k = keyOf(it), prev = m.get(k); m.set(k, !prev ? it : (itemStamp(it) >= itemStamp(prev) ? it : prev)); }
    let arr = [...m.values()];
    if(out.deleted[f]) arr = arr.filter(it => !out.deleted[f][keyOf(it)]);
    out[f] = arr;
  }
  const dk = new Set([...Object.keys(a.drafts), ...Object.keys(b.drafts)]);
  out.drafts = {};
  for(const k of dk){
    const x = a.drafts[k], y = b.drafts[k];
    const pick = !x ? y : !y ? x : (stamp(y.updatedAt) > stamp(x.updatedAt) ? y : x);
    if(pick && stamp(pick.updatedAt) > (out.deleted.drafts[k]||0)) out.drafts[k] = pick;
  }
  if(stamp(b.nextDayAt) > stamp(a.nextDayAt)){ out.nextDay = b.nextDay; out.nextDayAt = b.nextDayAt; }
  out.photos = {...b.photos};
  for(const [n,p] of Object.entries(a.photos)) if(!out.photos[n] || stamp(p.updatedAt) >= stamp(out.photos[n].updatedAt)) out.photos[n] = p;
  if(stamp(b.settingsAt) > stamp(a.settingsAt)){ out.settings = b.settings; out.settingsAt = b.settingsAt; }
  out.plans = a.plans || b.plans || clone(PLANS);
  if(stamp(b.plansAt) > stamp(a.plansAt)){ out.plans = b.plans; out.plansAt = b.plansAt; out.planBlock = b.planBlock; out.planStartedAt = b.planStartedAt; }
  out.planVersion = Math.max(a.planVersion||0, b.planVersion||0);
  return out;
}

/* ---------- treino ---------- */
const draftKey = d => 'active_'+d;
function template(d){
  return { date: today(), day: d, ex: state.plans[d].ex.map(([name,count,min,max]) => ({name,min,max,note:'',sets:Array.from({length:count},()=>({kg:'',reps:'',done:false}))})) };
}
function getDraft(d){ return state.drafts[draftKey(d)] || template(d); }
function ensureDraft(d){
  const k = draftKey(d);
  if(!state.drafts[k]) state.drafts[k] = template(d);
  return state.drafts[k];
}
function touch(dr){ dr.updatedAt = Date.now(); }

function sortedSessions(){
  return [...state.sessions].sort((a,b) => String(b.date).localeCompare(String(a.date)) || stamp(b.finishedAt) - stamp(a.finishedAt));
}
function lastPerf(name){
  for(const s of sortedSessions()){
    const e = (s.ex||[]).find(x => x.name === name);
    if(e && e.sets.some(x => x.done)) return {date:s.date, sets:e.sets.filter(x => x.done), note:e.note||''};
  }
  return null;
}
function bestKg(name){
  let best = null;
  for(const s of state.sessions) for(const e of (s.ex||[])) if(e.name === name) for(const x of e.sets) if(x.done && filled(x.kg)){
    const k = num(x.kg); if(!best || k > best.kg || (k === best.kg && num(x.reps) > best.reps)) best = {kg:k, reps:num(x.reps), date:s.date};
  }
  return best;
}

  if(last){
    const topped = last.sets.length && last.sets.every(s => num(s.reps) >= e.max);
    lastTxt = `<div class="last">Última vez (${brShort(last.date)}): <b>${last.sets.map(s => `${fmtKg(s.kg)}×${esc(s.reps)}`).join(' · ')}</b>${best?` <span class="muted">· recorde ${fmtKg(best.kg)} kg</span>`:''}
      ${topped?`<div class="hint">▲ Você bateu o topo da faixa (${e.max} reps) em todas as séries — hora de subir a carga.</div>`:''}
      ${last.note?`<div class="muted" style="margin-top:3px">Nota: ${esc(last.note)}</div>`:''}</div>`;
  } else lastTxt = `<div class="last">Primeira vez registrando este exercício. Escolha uma carga em que chegue a ${e.min}–${e.max} reps com boa execução.</div>`;
  return `<article class="card ex ${allDone?'done':''}" id="ex-${i}">
    <div class="ex-top"><img class="ex-thumb" src="${exImg(e.name,1)||exImg(e.name,0)}" alt="" loading="lazy" data-zoom="${i}">
      <div class="t"><div class="ex-num">EXERCÍCIO ${pad(i+1)}</div><div class="ex-name">${esc(e.name)}</div>
      <div class="ex-meta"><span class="badge">${esc(info[0])}</span>${e.extra?' <span class="badge extra-tag">EXTRA</span>':''} &nbsp;${e.sets.length} × ${e.min}–${e.max} reps</div></div></div>
    <div class="ex-body">
      ${lastTxt}
      <details class="how" data-photos="${esc(e.name)}"><summary>Fotos e execução</summary>${photoBlock(e.name)}<p>${esc(info[1])}</p></details>
      <div class="sethead"><span>SÉRIE</span><span>CARGA (KG)</span><span>REPS</span><span>FEITA</span></div>
      ${e.sets.map((s,j) => { const p = last?.sets[j] || last?.sets[last.sets.length-1];
        return `<div class="set ${s.done?'isdone':''}" data-row="${i}-${j}"><span class="setn">${j+1}</span>
        <input inputmode="decimal" autocomplete="off" data-i="${i}" data-j="${j}" data-f="kg" value="${esc(s.kg)}" placeholder="${p?esc(fmtKg(p.kg)):'kg'}" aria-label="Carga série ${j+1}">
        <input inputmode="numeric" autocomplete="off" data-i="${i}" data-j="${j}" data-f="reps" value="${esc(s.reps)}" placeholder="${p?esc(p.reps):e.min+'–'+e.max}" aria-label="Repetições série ${j+1}">
        <button type="button" class="chk ${s.done?'on':''}" data-i="${i}" data-j="${j}" data-done aria-label="Concluir série ${j+1}">${CHECK}</button></div>`; }).join('')}
      <textarea data-note="${i}" rows="1" placeholder="Nota (opcional): banco 3, pegada, sensação…">${esc(e.note||'')}</textarea>
      <div class="exbtns"><button class="btn-o btn-sm" data-add="${i}">＋ Série</button>
        ${i < d.ex.length-1 ? `<button class="btn-g btn-sm" data-next="${i+1}">Próximo →</button>` : `<button class="btn-g btn-sm" data-next="finish">Finalizar ↓</button>`}</div>
      ${e.sets.length > 1 && !hasData({ex:[{sets:[e.sets[e.sets.length-1]]}]}) ? `<button class="btn-sm" style="background:none;color:var(--mut);margin-top:4px;padding:6px" data-rem="${i}">− remover última série vazia</button>` : ''}
      <div class="exedit"><button class="btn-g btn-sm" data-swap="${i}">⇄ Trocar exercício</button><button class="btn-sm" style="background:none;color:var(--red)" data-delex="${i}">✕ Remover</button></div>
      ${e.swappedFrom ? `<small class="muted" style="display:block;margin-top:6px">No lugar de: ${esc(e.swappedFrom)}</small>` : ''}
    </div></article>`;
}

function updateCounters(d){
  const all = d.ex.flatMap(e => e.sets), done = all.filter(s => s.done).length;
  $('pill').textContent = `${done}/${all.length}`;
  $('pbar').style.width = (all.length ? Math.round(done/all.length*100) : 0)+'%';
  $('donecount').textContent = `${done} séries feitas`;
  d.ex.forEach((e,i) => $('ex-'+i)?.classList.toggle('done', e.sets.length > 0 && e.sets.every(s => s.done)));
}

function wireTrain(){
  const root = $('train');
  root.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { day = +b.dataset.day; renderTrain(); window.scrollTo({top:0}); });
  $('sdate').onchange = ev => { const d = ensureDraft(day); d.date = ev.target.value || today(); touch(d); save(); };
  $('rest').onchange = ev => { state.settings.rest = +ev.target.value; state.settingsAt = Date.now(); save(); };
  $('discard') && ($('discard').onclick = () => {
    if(!confirm('Descartar este rascunho? As séries não finalizadas serão apagadas.')) return;
    delete state.drafts[draftKey(day)]; state.deleted.drafts[draftKey(day)] = Date.now(); save(); renderTrain();
  });
  root.querySelectorAll('input[data-f]').forEach(el => el.oninput = () => {
    const d = ensureDraft(day), s = d.ex[+el.dataset.i].sets[+el.dataset.j];
    s[el.dataset.f] = el.value.replace(/[^\d.,]/g,''); if(el.value !== s[el.dataset.f]) el.value = s[el.dataset.f];
    touch(d); save();
  });
  root.querySelectorAll('[data-done]').forEach(b => b.onclick = () => {
    const d = ensureDraft(day), i = +b.dataset.i, j = +b.dataset.j, s = d.ex[i].sets[j];
    if(!s.done){
      // preenche com a sugestão (placeholder) se o campo estiver vazio
      const row = b.closest('.set'), [kgI, repI] = row.querySelectorAll('input');
      if(!filled(s.kg) && kgI.placeholder && kgI.placeholder !== 'kg'){ s.kg = kgI.placeholder.replace(',', '.'); kgI.value = s.kg; }
      if(!filled(s.reps) && /^\d+$/.test(repI.placeholder)){ s.reps = repI.placeholder; repI.value = s.reps; }
      if(!filled(s.kg) || !num(s.reps)){ toast('Preencha carga e repetições desta série.'); (filled(s.kg)?repI:kgI).focus(); return; }
    }
    s.done = !s.done;
    if(s.done && !d.startedAt){ startWorkout(true); }
    b.classList.toggle('on', s.done); b.closest('.set').classList.toggle('isdone', s.done);
    touch(d); save(); updateCounters(d);
    if(s.done){
      const ex = d.ex[i], nextSet = ex.sets.findIndex(x => !x.done);
      startTimer(state.settings.rest, nextSet >= 0 ? `${ex.name} • série ${nextSet+1}` : (d.ex[i+1] ? `Próximo: ${d.ex[i+1].name}` : 'Último exercício concluído'));
      if(nextSet < 0 && d.ex[i+1]) setTimeout(() => $('ex-'+(i+1))?.scrollIntoView({behavior:'smooth',block:'start'}), 350);
    }
  });
  root.querySelectorAll('[data-note]').forEach(t => t.oninput = () => { const d = ensureDraft(day); d.ex[+t.dataset.note].note = t.value; touch(d); save(); });
  root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const d = ensureDraft(day); d.ex[+b.dataset.add].sets.push({kg:'',reps:'',done:false}); touch(d); save(); keepScroll(renderTrain); });
  root.querySelectorAll('[data-rem]').forEach(b => b.onclick = () => { const d = ensureDraft(day); d.ex[+b.dataset.rem].sets.pop(); touch(d); save(); keepScroll(renderTrain); });
  root.querySelectorAll('[data-next]').forEach(b => b.onclick = () => (b.dataset.next === 'finish' ? $('finish') : $('ex-'+b.dataset.next))?.scrollIntoView({behavior:'smooth',block:'start'}));
  root.querySelectorAll('[data-zoom]').forEach(img => img.onclick = () => { const det = img.closest('.ex').querySelector('details.how'); det.open = true; });
  wirePhotoButtons(root);
  $('finish').onclick = finishSession;
  $('startWorkout') && ($('startWorkout').onclick = () => { startWorkout(); keepScroll(renderTrain); });
  $('addEx').onclick = openAddExercise;
  root.querySelectorAll('[data-delex]').forEach(b => b.onclick = () => openRemoveSheet(+b.dataset.delex));
  root.querySelectorAll('[data-swap]').forEach(b => b.onclick = () => openSwapSheet(+b.dataset.swap));
  $('ckGo') && ($('ckGo').onclick = openCheckin);
  $('planGo') && ($('planGo').onclick = () => { tab = 'evo'; evoTab = 'analise'; render(); window.scrollTo({top:0}); });
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo({top:y}); }

function finishSession(){
  const k = draftKey(day), d = state.drafts[k];
  const completed = d ? d.ex.flatMap(e => e.sets).filter(s => s.done) : [];
  if(!completed.length) return toast('Marque ao menos uma série concluída.');
  if(completed.some(s => !num(s.reps) || !filled(s.kg) || num(s.kg) < 0)) return toast('Preencha carga e repetições das séries marcadas.');
  if(!confirm(`Finalizar o treino D${day+1} com ${completed.length} séries?`)) return;
  const fdur = d.startedAt ? Date.now() - Date.parse(d.startedAt) : null;
  const prs = d.ex.filter(e => { const b = bestKg(e.name), m = Math.max(0, ...e.sets.filter(s=>s.done).map(s=>num(s.kg))); return b && m > b.kg; }).map(e => e.name);
  const now = new Date();
  const record = {...clone(d), id:uuid(), planName:state.plans[day].name, finishedAt:now.toISOString(), updatedAt:now.toISOString(), planVersion:6,
    durationMin: fdur != null ? Math.max(1, Math.round(fdur/60000)) : null, durationSec: fdur != null ? Math.round(fdur/1000) : null};
  state.sessions.push(record);
  delete state.drafts[k]; state.deleted.drafts[k] = Date.now();
  state.nextDay = (day+1) % 5; state.nextDayAt = now.toISOString(); day = state.nextDay;
  stopTimer(); save(); updateSessionBar(); releaseWake();
  tab = 'history'; render(); window.scrollTo({top:0});
  showSummary(record, prs);
}

/* ---------- cronômetro de descanso ---------- */
let tEnd = 0, tInt = null, tAlerted = false;
function startTimer(sec, label){
  tEnd = Date.now() + sec*1000; tAlerted = false;
  try{ localStorage.setItem('forca92.rest', JSON.stringify({end:tEnd, label:label||''})); }catch(e){}
  $('tlabel').textContent = label || 'próxima série';
  $('timer').classList.remove('hidden','over'); document.body.classList.add('timing');
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function stopTimer(){ clearInterval(tInt); $('timer').classList.add('hidden'); $('bigtimer').classList.add('hidden'); document.body.classList.remove('timing'); try{ localStorage.removeItem('forca92.rest'); }catch(e){} }
function tick(){
  const left = Math.round((tEnd - Date.now())/1000), a = Math.abs(left);
  const txt = (left < 0 ? '+' : '') + pad(Math.floor(a/60)) + ':' + pad(a%60);
  $('tclock').textContent = txt; $('bigclock').textContent = txt;
  if(left <= 0 && !tAlerted){ tAlerted = true; $('timer').classList.add('over'); $('bigtimer').classList.add('over'); try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){} beep(); }
  if(left < -300) stopTimer();
}
function beep(){ try{ const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.25,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6); o.start(); o.stop(c.currentTime+.6); }catch(e){} }
$('tminus').onclick = () => { tEnd -= 15000; tick(); };
$('tplus').onclick = () => { tEnd += 15000; tAlerted = false; $('timer').classList.remove('over'); $('bigtimer').classList.remove('over'); tick(); };
$('tstop').onclick = stopTimer;
$('tclock').onclick = () => { $('biglabel').textContent = $('tlabel').textContent; $('bigtimer').classList.remove('hidden'); };
$('bminus').onclick = $('tminus').onclick; $('bplus').onclick = $('tplus').onclick; $('bstop').onclick = stopTimer;
$('bclose').onclick = () => $('bigtimer').classList.add('hidden');
(function resumeRest(){ try{ const r = JSON.parse(localStorage.getItem('forca92.rest')||'null'); if(r && Date.now() - r.end < 120000) { const left = Math.round((r.end - Date.now())/1000); startTimer(0, r.label); tEnd = r.end; tAlerted = left <= 0; tick(); } else localStorage.removeItem('forca92.rest'); }catch(e){} })();

/* ---------- treino em andamento: cronômetro geral + tela acesa ---------- */
const fmtDur = ms => { const t = Math.max(0, Math.floor(ms/1000)), h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60; return (h ? h+':'+pad(m) : pad(m)) + ':' + pad(sec); };
function activeDraft(){
  const list = Object.values(state.drafts||{}).filter(d => d && d.startedAt);
  return list.sort((a,b) => Date.parse(b.startedAt) - Date.parse(a.startedAt))[0] || null;
}
function startWorkout(auto){
  const d = ensureDraft(day);
  if(!d.startedAt){ d.startedAt = new Date().toISOString(); touch(d); save(); }
  if(state.settings.keepAwake !== false) requestWake();
  updateSessionBar();
  if(auto) toast('⏱ Treino iniciado.');
}
let sessInt = null;
function updateSessionBar(){
  const d = activeDraft(), bar = $('sessbar');
  if(!d){ bar.classList.add('hidden'); clearInterval(sessInt); sessInt = null; return; }
  bar.classList.remove('hidden');
  $('sesslbl').textContent = `D${(d.day??0)+1} · ${state.plans[d.day]?.name || 'Treino'}`;
  $('awakeBtn').classList.toggle('on', !!wakeLock);
  const t = () => { $('sessclock').textContent = fmtDur(Date.now() - Date.parse(d.startedAt)); };
  t(); clearInterval(sessInt); sessInt = setInterval(t, 1000);
}
let wakeLock = null, wakeWarned = false;
async function requestWake(){
  if(!('wakeLock' in navigator)){ if(!wakeWarned){ wakeWarned = true; toast('Este navegador não permite manter a tela acesa. Atualize o iOS ou ajuste o bloqueio automático.', 5000); } return; }
  try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; $('awakeBtn').classList.remove('on'); }); }
  catch(e){ wakeLock = null; }
  $('awakeBtn').classList.toggle('on', !!wakeLock);
}
function releaseWake(){ try{ wakeLock?.release(); }catch(e){} wakeLock = null; $('awakeBtn').classList.remove('on'); }
$('awakeBtn').onclick = () => {
  if(wakeLock){ releaseWake(); state.settings.keepAwake = false; toast('Tela pode apagar normalmente.'); }
  else { state.settings.keepAwake = true; requestWake().then(() => wakeLock && toast('☀ Tela ficará acesa durante o treino.')); }
  state.settingsAt = Date.now(); persist(); dirty = true;
};
$('sessFinish').onclick = () => {
  const d = activeDraft(); if(!d) return;
  tab = 'train'; day = d.day; render();
  setTimeout(() => $('finish')?.scrollIntoView({behavior:'smooth', block:'center'}), 50);
};
document.addEventListener('visibilitychange', () => { if(!document.hidden && activeDraft()){ updateSessionBar(); if(state.settings.keepAwake !== false && !wakeLock) requestWake(); } });

function closeSheet(){ $('sheetbg').classList.add('hidden'); $('sheet').innerHTML = ''; document.body.style.overflow = ''; }
$('sheetbg').addEventListener('click', e => { if(e.target === $('sheetbg')) closeSheet(); });
let addSel = [], addSets = 3, addGroup = '', addQ = '', addMode = 'add', swapIdx = -1, swapPlan = false;
function rangeForEx(name){
  const info = EX[name];
  if(!info) return [10,12];
  if(info[4] === 'Abdômen') return [12,15];
  if(info[4] === 'Panturrilha') return [12,15];

function openSwapSheet(i){

// nome original na ficha (antes de trocas feitas hoje)
const planName = e => e.swappedFrom || e.name;
const inPlanDay = (e, d) => !e.extra && state.plans[d].ex.some(x => x[0] === planName(e));
function replaceInPlan(d, oldName, newName){
  const p = state.plans[d], j = p.ex.findIndex(x => x[0] === oldName);
  if(j < 0) return false;
  state.planHistory.push({id:uuid(), date:new Date().toISOString(), reason: newName ? `Troca no D${d+1}: ${oldName} → ${newName}` : `Removido do D${d+1}: ${oldName}`, plans:clone(state.plans), version:state.planVersion||6});
  if(newName) p.ex[j] = [newName, p.ex[j][1], p.ex[j][2], p.ex[j][3]]; else p.ex.splice(j,1);
  state.plansAt = new Date().toISOString();
  return true;
}
function openRemoveSheet(i){

  const done = e.sets.filter(s => s.done).length, canPlan = inPlanDay(e, day);

const idb = (mode, fn) => new Promise(ok => { if(!photoDB) return ok(null); try{ const tx = photoDB.transaction('photos',mode), st = tx.objectStore('photos'), r = fn(st); tx.oncomplete = () => ok(r?.result ?? null); tx.onerror = () => ok(null); }catch(e){ ok(null); } });
const idbGet = k => idb('readonly', st => st.get(k));
const idbPut = (k,v) => idb('readwrite', st => st.put(v,k));
const idbDel = k => idb('readwrite', st => st.delete(k));
async function getOwn(name){

function pickPhoto(name, scope){

function compress(file, max, q){
  return new Promise((ok,no) => {
    if(file.size > 25*1024*1024) return no(new Error('foto acima de 25 MB'));
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const sc = Math.min(1, max/Math.max(img.width,img.height)), c = document.createElement('canvas');
      c.width = Math.max(1,Math.round(img.width*sc)); c.height = Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg',q)); };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('formato não suportado')); };
    img.src = u;
  });
}
const pendingList = () => { try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } };
const setPending = l => localStorage.setItem(PENDING_KEY, JSON.stringify([...new Set(l)]));
async function setOwn(name, data){

}
async function removeOwn(name, scope){

  state.photos[name] = {updatedAt:Date.now(), path:null, removed:true}; save();

function blobToData(b){ return new Promise((ok,no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); }); }
async function uploadPending(){
  if(!client || !uid) return;
  let changed = false;
  for(const name of pendingList()){
    if(typeof name !== 'string') continue;
    const v = await idbGet(name+'::own'); if(!v){ setPending(pendingList().filter(n => n !== name)); continue; }
    const path = `${uid}/${slug(name)}.jpg`;
    const {error} = await client.storage.from(BUCKET).upload(path, dataToBlob(typeof v === 'string' ? v : v.data), {upsert:true, contentType:'image/jpeg', cacheControl:'60'});
    if(error){ setStatus('Fotos pendentes: '+error.message, 'err'); return; }
    state.photos[name] = {updatedAt: (typeof v === 'object' && v.updatedAt) || Date.now(), path};
    setPending(pendingList().filter(n => n !== name)); changed = true;
  }
  if(changed) save();
}
async function downloadPhotos(){
  if(!client || !uid) return;
  let changed = false;
  for(const [name, meta] of Object.entries(state.photos)){
    const local = await idbGet(name+'::own'), lts = local && typeof local === 'object' ? local.updatedAt||0 : (local ? 1 : 0);
    if(stamp(meta.updatedAt) <= lts) continue;
    if(meta.removed){ await idbDel(name+'::own'); ownCache.set(name,null); changed = true; continue; }
    if(!meta.path) continue;
    const {data, error} = await client.storage.from(BUCKET).download(meta.path);
    if(error || !data) continue;
    const d = await blobToData(data); await idbPut(name+'::own', {data:d, updatedAt:stamp(meta.updatedAt)}); ownCache.set(name, d); changed = true;
  }
  if(changed) fillOwnPhotos(document);
}

/* ---------- evolução ---------- */
function lineChart(pts, {unit='', goal=null, color='#ffc800'} = {}){
  if(pts.length < 2) return `<p class="muted" style="font-size:13px">Registre ao menos 2 vezes para ver o gráfico.</p>`;
  const W = 340, H = 170, L = 34, R = 10, T = 12, B = 26;
  const ys = pts.map(p => p.y).concat(goal != null ? [goal] : []);
  let mn = Math.min(...ys), mx = Math.max(...ys); if(mx - mn < 2){ mn -= 1; mx += 1; }
  const padY = (mx-mn)*.12; mn -= padY; mx += padY;
  const x = i => L + (W-L-R) * (pts.length === 1 ? .5 : i/(pts.length-1));
  const y = v => T + (H-T-B) * (1 - (v-mn)/(mx-mn));
  const ticks = [0,1,2,3].map(k => mn + (mx-mn)*k/3);
  const path = pts.map((p,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const step = Math.ceil(pts.length/5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#262e36"/><text x="${L-5}" y="${y(t)+3.5}" fill="#7d8690" font-size="10" text-anchor="end">${Math.round(t)}</text>`).join('')}
    ${goal != null ? `<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#7fd67a" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(goal)-4}" fill="#7fd67a" font-size="10" text-anchor="end">meta ${goal}${unit}</text>` : ''}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="3.4" fill="${color}"/>${(i%step===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-8}" fill="#7d8690" font-size="10" text-anchor="middle">${esc(p.label)}</text>`:''}`).join('')}
  </svg>`;
}

/* ---------- sincronização ---------- */
async function connect(){
  if(!cfg.url || !cfg.key){ setStatus('Local • sem nuvem'); return; }
  if(!window.supabase){ setStatus('Offline • nuvem indisponível', 'err'); return; }
  try{
    // mesma chave de sessão da V7: quem já estava logado continua logado
    client = window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:true, autoRefreshToken:true}});
    const {data:{session}} = await client.auth.getSession();
    client.auth.onAuthStateChange((ev, s) => { uid = s?.user?.id || null; });
    if(session){ uid = session.user.id; await pull(); } else setStatus('Nuvem • faça login', 'wait');
  }catch(e){ setStatus('Erro na nuvem: '+e.message, 'err'); }
}
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
async function pull(){
  if(!client || !uid || syncBusy) return;
  syncBusy = true; setStatus('Consultando nuvem…', 'wait');
  try{
    const {data, error} = await client.from(TABLE).select('payload,revision').eq('user_id', uid).maybeSingle();
    if(error) throw error;
    revision = data?.revision || 0;
    const before = JSON.stringify(state);
    if(data?.payload && Object.keys(data.payload).length){
      const merged = merge(state, data.payload);
      dirty = JSON.stringify(merged) !== JSON.stringify(data.payload);
      state = merged; persist();
    } else dirty = true;
    if(JSON.stringify(state) !== before) afterRemoteChange();
  }catch(e){ setStatus('Erro na nuvem: '+e.message, 'err'); syncBusy = false; return; }
  syncBusy = false;
  await uploadPending(); await uploadCheckinPending(); await downloadPhotos();
  if(dirty) await push(); else setStatus('Nuvem sincronizada ✓', 'ok');
}
function afterRemoteChange(){
  updateSessionBar();
  if(!hasData(state.drafts[draftKey(day)])) day = state.nextDay;
  if(!typing() && editingId == null) render();
}
async function push(){
  if(!dirty || !client || !uid) return;
  if(syncBusy){ clearTimeout(debounce); debounce = setTimeout(push, 1500); return; }
  syncBusy = true; setStatus('Enviando…', 'wait');
  try{
    for(let attempt = 0; attempt < 4; attempt++){
      const snapshot = JSON.stringify(state);
      const {data, error} = await client.rpc('forca92_write', {expected_revision:revision, new_payload:JSON.parse(snapshot)});
      if(!error){ revision = data; dirty = JSON.stringify(state) !== snapshot; break; }
      if(!String(error.message).includes('REVISION_CONFLICT')) throw error;
      const res = await client.from(TABLE).select('payload,revision').eq('user_id', uid).single();
      if(res.error) throw res.error;
      revision = res.data.revision;
      const before = JSON.stringify(state);
      state = merge(state, res.data.payload); persist();
      if(JSON.stringify(state) !== before) afterRemoteChange();
    }
    setStatus(dirty ? 'Pendente de envio' : 'Nuvem sincronizada ✓', dirty ? 'wait' : 'ok');
  }catch(e){ setStatus('Pendente: '+(navigator.onLine ? e.message : 'sem internet'), 'err'); }
  finally{ syncBusy = false; if(dirty && navigator.onLine){ clearTimeout(debounce); debounce = setTimeout(push, 6000); } }
}

/* ---------- fotos dos check-ins (aparelho + nuvem) ---------- */
const ckKey = (id,pose) => `ck::${id}::${pose}`;
const ckPath = (id,pose) => `${uid}/checkins/${id}/${pose}.jpg`;
const ckCache = new Map();
async function getCkPhoto(id, pose){
  const k = ckKey(id,pose);
  if(ckCache.get(k)) return ckCache.get(k);
  const v = await idbGet(k);
  if(v){ const d = typeof v === 'string' ? v : v.data; ckCache.set(k, d); return d; }
  const ck = state.checkins.find(c => c.id === id), meta = ck?.photos?.[pose];
  if(meta?.path && client && uid){
    const {data, error} = await client.storage.from(BUCKET).download(meta.path);
    if(!error && data){ const d = await blobToData(data); await idbPut(k, {data:d, updatedAt:stamp(meta.updatedAt)}); ckCache.set(k, d); return d; }
  }
  return null;
}
async function fillCkPhotos(scope){
  for(const img of scope.querySelectorAll('img[data-ck]')){
    const d = await getCkPhoto(img.dataset.ck, img.dataset.pose);
    if(d){ img.src = d; img.closest('.ph')?.classList.remove('empty'); }
    else img.closest('.ph')?.classList.add('empty');
  }
}

/* fila de envio genérica: fotos de aparelho (nome) e fotos de check-in ({k,p}) */
function queueUpload(item){ const l = pendingList(); l.push(item); setPending(l); }
const setPendingRaw = l => localStorage.setItem(PENDING_KEY, JSON.stringify(l));
async function uploadCheckinPending(){
  if(!client || !uid) return false;
  let changed = false;
  const list = pendingList(), keep = [];
  for(const it of list){
    if(typeof it === 'string'){ keep.push(it); continue; }      // foto de aparelho: tratada por uploadPending()
    const v = await idbGet(it.k);
    if(!v){ continue; }
    const path = `${uid}/${it.p}`;
    const {error} = await client.storage.from(BUCKET).upload(path, dataToBlob(typeof v === 'string' ? v : v.data), {upsert:true, contentType:'image/jpeg', cacheControl:'3600'});
    if(error){ keep.push(it); setStatus('Fotos pendentes: '+error.message, 'err'); continue; }
    const ck = state.checkins.find(c => c.id === it.id);
    if(ck){ ck.photos[it.pose] = {path, updatedAt:(typeof v === 'object' && v.updatedAt) || Date.now()}; ck.updatedAt = new Date().toISOString(); changed = true; }
  }
  setPendingRaw(keep);
  if(changed) save();
  return changed;
}

function shoot(){
  const v = $('camVideo');
  if(!cam.stream || !v.videoWidth) return toast('Câmera não está pronta. Use "Galeria / câmera".');
  const go = () => {
    const sc = Math.min(1, 1280/Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth*sc); c.height = Math.round(v.videoHeight*sc);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    cam.shot = c.toDataURL('image/jpeg', .82); showShot();
    try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
  };
  if(!cam.timer) return go();
  let n = cam.timer; const cd = $('camCount'); cd.textContent = n; cd.classList.remove('hidden');

  cam.countInt = setInterval(() => { n--; if(n <= 0){ clearInterval(cam.countInt); cd.classList.add('hidden'); go(); } else { cd.textContent = n; if(n <= 3) beep(); } }, 1000);

/* ---------- análise por números ---------- */
const e1rm = s => num(s.kg) * (1 + num(s.reps)/30);
function exposures(name){
  return [...state.sessions].sort((a,b) => String(a.date).localeCompare(String(b.date)) || stamp(a.finishedAt) - stamp(b.finishedAt))
    .map(s => { const e = (s.ex||[]).find(x => x.name === name); const done = e ? e.sets.filter(x => x.done && filled(x.kg) && num(x.reps)) : []; return done.length ? {date:s.date, best:Math.max(...done.map(e1rm))} : null; })
    .filter(Boolean);
}
function exStatus(name){
  const ex = exposures(name);
  if(ex.length < 4) return {status:'novo', n:ex.length};
  const prevBest = Math.max(...ex.slice(0,-3).map(x => x.best)), recentBest = Math.max(...ex.slice(-3).map(x => x.best));
  const change = prevBest ? (recentBest/prevBest - 1) : 0;
  return {status: change > .01 ? 'progredindo' : change < -.05 ? 'regredindo' : 'platô', n:ex.length, change};
}
function regression(pts){ // pts: [{t:dias, y}]
  const n = pts.length, mx = pts.reduce((a,p)=>a+p.t,0)/n, my = pts.reduce((a,p)=>a+p.y,0)/n;
  const num_ = pts.reduce((a,p)=>a+(p.t-mx)*(p.y-my),0), den = pts.reduce((a,p)=>a+(p.t-mx)**2,0);
  return den ? num_/den : 0;
}
function measureDelta(field, days){
  const ms = state.measurements.filter(m => m[field] != null && m[field] !== '').sort((a,b) => String(a.date).localeCompare(String(b.date)));
  if(ms.length < 2) return null;
  const last = ms.at(-1), cut = new Date(Date.parse(last.date) - days*864e5).toISOString().slice(0,10);
  const base = [...ms].reverse().find(m => m.date <= cut) || ms[0];
  if(base === last) return null;
  return {delta:num(last[field]) - num(base[field]), days:daysBetween(base.date, last.date), from:base.date, to:last.date};
}
function planStart(){
  if(state.planStartedAt) return state.planStartedAt;
  const ph = (state.planHistory||[]).map(p => String(p.date).slice(0,10)).sort().at(-1);
  const first = [...state.sessions].map(s => s.date).sort()[0];
  return ph && first ? (ph > first ? ph : first) : (ph || first || today());
}
function analysis(){
  const r = {reasons:[], good:[], warn:[], priorities:new Set()};
  // peso
  const ws = state.measurements.filter(m => m.weight != null && m.weight !== '').sort((a,b) => String(a.date).localeCompare(String(b.date)));
  const bw = ws.length ? num(ws.at(-1).weight) : null;
  const recentW = ws.filter(m => daysBetween(m.date, today()) <= 42);
  if(recentW.length >= 2 && daysBetween(recentW[0].date, recentW.at(-1).date) >= 10){
    const t0 = Date.parse(recentW[0].date);
    r.rate = regression(recentW.map(m => ({t:(Date.parse(m.date)-t0)/864e5, y:num(m.weight)}))) * 7;
    const lo = bw*.0025, hi = bw*.005;
    r.rateLo = lo; r.rateHi = hi;
    if(r.rate < lo*0.4) r.warn.push(`Peso quase parado (${fmtKg(r.rate)} kg/semana). Para ganhar massa, o alvo é ${fmtKg(lo)}–${fmtKg(hi)} kg/semana: aumente um pouco as calorias.`);
    else if(r.rate > hi*1.5) r.warn.push(`Peso subindo rápido (${fmtKg(r.rate)} kg/semana). Acima de ${fmtKg(hi)} kg/semana tende a vir mais gordura.`);
    else r.good.push(`Ritmo de ganho de peso adequado: ${fmtKg(r.rate)} kg/semana (alvo ${fmtKg(lo)}–${fmtKg(hi)}).`);
  } else r.warn.push('Registre o peso toda semana (no check-in) para medir o ritmo de ganho.');
  // cintura x peso
  const dW = measureDelta('weight', 28), dWaist = measureDelta('waist', 28);
  if(dW && dWaist){
    if(dWaist.delta > .8 && dWaist.delta > dW.delta) r.warn.push(`Cintura subiu ${fmtKg(dWaist.delta)} cm em ${dWaist.days} dias com o peso subindo ${fmtKg(dW.delta)} kg: sinal de ganho de gordura.`);
    else if(dW.delta > 0 && dWaist.delta <= .5) r.good.push(`Peso +${fmtKg(dW.delta)} kg com cintura estável (${dWaist.delta>=0?'+':''}${fmtKg(dWaist.delta)} cm): ganho de qualidade.`);
  }
  for(const [f, label, mus] of [['arm','Braço',['Bíceps','Tríceps']],['thigh','Coxa',['Quadríceps']],['chest','Peito',['Peito']]]){
    const d = measureDelta(f, 35);
    if(!d || d.days < 21) continue;
    if(d.delta <= .2){ r.warn.push(`${label} sem crescer em ${d.days} dias (${d.delta>=0?'+':''}${fmtKg(d.delta)} cm).`); mus.forEach(m => r.priorities.add(m)); }
    else r.good.push(`${label} +${fmtKg(d.delta)} cm em ${d.days} dias.`);
  }
  // exercícios
  const names = [...new Set(state.plans.flatMap(p => p.ex.map(e => e[0])))];
  r.ex = names.map(n => ({name:n, ...exStatus(n)}));
  const rated = r.ex.filter(x => x.status !== 'novo');
  r.plateau = rated.filter(x => x.status === 'platô' || x.status === 'regredindo');
  r.plateauPct = rated.length ? r.plateau.length / rated.length : 0;
  if(rated.length){
    const prog = rated.filter(x => x.status === 'progredindo').length;
    (r.plateauPct >= .5 ? r.warn : r.good).push(`${prog} de ${rated.length} exercícios progredindo nas últimas 3 sessões; ${r.plateau.length} em platô.`);
  }
  const byMus = {};
  for(const x of rated){ const m = exInfo(x.name)[4]; if(!m) continue; (byMus[m] ||= []).push(x.status); }
  for(const [m, st] of Object.entries(byMus)) if(st.length && st.every(s => s !== 'progredindo')) r.priorities.add(m);
  // aderência e idade da ficha
  const d28 = new Date(Date.now() - 28*864e5).toISOString().slice(0,10);
  r.adherence = state.sessions.filter(s => s.date >= d28).length / 20;
  r.planWeeks = Math.floor(daysBetween(planStart(), today()) / 7);
  if(r.adherence < .6) r.warn.push(`Frequência de ${Math.round(r.adherence*100)}% nas últimas 4 semanas. Antes de trocar a ficha, o ganho maior vem de treinar com regularidade.`);
  // IA
  const ai = [...state.checkins].filter(c => c.ai?.result).sort((a,b) => String(a.date).localeCompare(String(b.date))).at(-1);
  if(ai && daysBetween(ai.date, today()) <= 21) for(const m of (ai.ai.result.grupos_prioritarios || [])) if(MUSCLES.includes(m)) r.priorities.add(m);
  r.aiRecommends = !!(ai && daysBetween(ai.date, today()) <= 14 && ai.ai.result.recomenda_trocar_ficha);
  // veredito
  if(r.adherence >= .6 && (r.plateauPct >= .5 || r.planWeeks >= 8 || (r.aiRecommends && r.planWeeks >= 4))){
    r.verdict = 'trocar';
    if(r.plateauPct >= .5) r.reasons.push(`${Math.round(r.plateauPct*100)}% dos exercícios sem progresso`);
    if(r.planWeeks >= 8) r.reasons.push(`ficha atual com ${r.planWeeks} semanas`);
    if(r.aiRecommends) r.reasons.push('a análise das fotos indicou troca');
  } else if(r.adherence >= .6 && (r.plateauPct >= .3 || r.planWeeks >= 6)) r.verdict = 'atencao';
  else if(!rated.length) r.verdict = 'dados';
  else r.verdict = 'ok';
  r.priorities = [...r.priorities];
  return r;
}

/* ---------- proposta de nova ficha ---------- */
function generatePlan(priorities){
  const A = analysis(), status = Object.fromEntries(A.ex.map(x => [x.name, x.status]));
  const nextBlock = (state.planBlock || 'A') === 'A' ? 'B' : 'A';
  const prevPlans = (state.planHistory || []).at(-1)?.plans || [];
  const prevNames = new Set(prevPlans.flatMap(p => p.ex.map(e => e[0])));
  const out = state.plans.map(p => ({name:p.name, ex:[]}));
  const changes = [], useCount = {};
  const rangeFor = (name, oldMin, oldMax) => {
    const info = EX[name], mus = info?.[4], kind = info?.[5];
    if(mus === 'Abdômen') return [12,15];
    if(mus === 'Panturrilha') return nextBlock === 'A' ? [10,15] : [12,20];
    if(kind === 'c') return nextBlock === 'A' ? [6,10] : [8,12];
    return nextBlock === 'A' ? [10,12] : [12,15];
  };
  state.plans.forEach((p, d) => {
    p.ex.forEach(([name, sets, min, max]) => {
      const info = EX[name]; let to = name, why = [];
      const st = status[name];
      const swap = info && (st === 'platô' || st === 'regredindo' || (A.planWeeks >= 8 && info[5] === 'i'));
      if(swap){
        const dayNames = new Set([...out[d].ex.map(e => e[0]), ...p.ex.map(e => e[0])]);
        const stuck = n => status[n] === 'platô' || status[n] === 'regredindo';
        const cands = Object.keys(EX).filter(n => EX[n][3] === info[3] && n !== name && !dayNames.has(n))
          .sort((a,b) => (stuck(a)?1:0) - (stuck(b)?1:0) || (useCount[a]||0) - (useCount[b]||0) || (prevNames.has(a)?1:0) - (prevNames.has(b)?1:0));
        if(cands.length){ to = cands[0]; why.push(st === 'platô' ? 'platô: troca de variação' : st === 'regredindo' ? 'carga caindo: troca de variação' : 'variação após 8 semanas'); }
      }
      useCount[to] = (useCount[to]||0) + 1;
      const mus = EX[to]?.[4];
      let s = sets;
      if(mus && priorities.includes(mus) && s < 4){ s++; why.push('+1 série (prioridade)'); }
      const [nmin, nmax] = rangeFor(to, min, max);
      out[d].ex.push([to, s, nmin, nmax]);
      changes.push({day:d, from:name, to, sets:s, oldSets:sets, range:[nmin,nmax], oldRange:[min,max], why});
    });
  });
  // volume semanal por músculo: 10–20 séries (abdômen/panturrilha: 6–16)
  const vol = () => { const v = Object.fromEntries(MUSCLES.map(m => [m,0])); out.forEach(p => p.ex.forEach(([n,s]) => { const m = EX[n]?.[4]; if(m && m in v) v[m] += s; })); return v; };
  let v = vol();
  for(const m of MUSCLES){
    const [lo, hi] = m === 'Glúteos' || m === 'Abdômen' ? [4,16] : m === 'Panturrilha' ? [6,16] : [10,20];
    let guard = 0;
    while(v[m] < lo && guard++ < 10){
      let added = false;
      for(const [d,p] of out.entries()) for(const [i,e] of p.ex.entries()) if(!added && EX[e[0]]?.[4] === m && e[1] < 4){ e[1]++; added = true; const c = changes.filter(c => c.day === d)[i]; c.sets = e[1]; c.why.push(`+1 série (${m} abaixo de ${lo}/semana)`); }
      if(!added) break; v = vol();
    }
    guard = 0;
    while(v[m] > hi && guard++ < 10){
      let cut = false;
      for(const [d,p] of out.entries()) for(const [i,e] of p.ex.entries()) if(!cut && EX[e[0]]?.[4] === m && EX[e[0]]?.[5] === 'i' && e[1] > 2){ e[1]--; cut = true; const c = changes.filter(c => c.day === d)[i]; c.sets = e[1]; c.why.push(`−1 série (${m} acima de ${hi}/semana)`); }
      if(!cut) break; v = vol();
    }
  }
  return {plans:out, changes, volume:v, block:nextBlock, analysis:A, priorities};
}
let proposal = null;
function approveProposal(){
  if(!proposal) return;
  if(!confirm('Aprovar a nova ficha? A ficha atual fica guardada no histórico de fichas.')) return;
  const now = new Date().toISOString();
  state.planHistory.push({id:uuid(), date:now, reason:`Nova ficha aprovada (bloco ${proposal.block})`, plans:clone(state.plans), version:state.planVersion||6});
  state.plans = proposal.plans; state.planBlock = proposal.block; state.planStartedAt = today(); state.plansAt = now;
  for(const k of Object.keys(state.drafts)) if(!hasData(state.drafts[k])){ delete state.drafts[k]; state.deleted.drafts[k] = Date.now(); }
  proposal = null; save(); toast('Nova ficha ativa. Bons treinos!', 3500);
  tab = 'train'; render(); window.scrollTo({top:0});
}

/* ---------- IA ---------- */
async function shrink(dataUrl, max=768, q=.75){
  return new Promise(ok => { const img = new Image(); img.onload = () => { const sc = Math.min(1, max/Math.max(img.width,img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg', q)); }; img.onerror = () => ok(null); img.src = dataUrl; });
}
let aiBusy = false;
async function runAI(id){
  if(aiBusy) return;
  if(!client || !uid) return toast('Entre na nuvem para usar a análise por IA.');
  const ck = state.checkins.find(c => c.id === id); if(!ck) return;
  const all = ckSorted(), idx = all.findIndex(c => c.id === id), prev = idx > 0 ? all[idx-1] : null, first = idx > 1 ? all[0] : null;
  aiBusy = true; renderEvo();
  try{
    const images = [];
    for(const [pose, name] of POSES){ const d = await getCkPhoto(ck.id, pose); if(d) images.push({label:`ATUAL (${br(ck.date)}) — ${name}`, data:(await shrink(d)).split(',')[1]}); }
    for(const [ref, tag] of [[prev,'ANTERIOR'],[first,'PRIMEIRO CHECK-IN']]) if(ref) for(const [pose, name] of POSES.slice(0,4)){ const d = await getCkPhoto(ref.id, pose); if(d) images.push({label:`${tag} (${br(ref.date)}) — ${name}`, data:(await shrink(d)).split(',')[1]}); }
    if(!images.some(i => i.label.startsWith('ATUAL'))) throw new Error('Este check-in não tem fotos disponíveis neste aparelho nem na nuvem.');
    const A = analysis();
    const metrics = {
      objetivo:'Hipertrofia natural, meta de 92 kg de peso corporal', data_checkin:ck.date,
      medidas:[...state.measurements].sort((a,b) => String(a.date).localeCompare(String(b.date))).slice(-10).map(m => ({data:m.date, peso:m.weight, cintura:m.waist, peito:m.chest, braco:m.arm, coxa:m.thigh, panturrilha:m.calf})),
      ritmo_peso_kg_semana: A.rate != null ? +A.rate.toFixed(2) : null,
      aderencia_4_semanas_pct: Math.round(A.adherence*100), semanas_na_ficha_atual: A.planWeeks,
      exercicios: A.ex.map(x => ({nome:x.name, musculo:exInfo(x.name)[4], status:x.status, sessoes:x.n})),
      alertas_numericos: A.warn, pontos_positivos_numericos: A.good
    };
    const {data, error} = await client.functions.invoke(AI_FUNCTION, {body:{images, metrics}});
    if(error){
      let msg = error.message;
      try{ const j = await error.context.json(); msg = j.error || msg; }catch(e){}
      throw new Error(msg);
    }
    if(!data?.result) throw new Error(data?.error || 'resposta vazia da função');
    ck.ai = {at:new Date().toISOString(), model:data.model, result:data.result};
    ck.updatedAt = new Date().toISOString(); save();
    toast('Análise concluída.');
  }catch(e){ toast('IA: '+e.message, 6000); }
  aiBusy = false; renderEvo();
}
async function testAI(){
  if(!client || !uid) return toast('Entre na nuvem primeiro.');
  const {data, error} = await client.functions.invoke(AI_FUNCTION, {body:{ping:true}});
  if(error){ let msg = error.message; try{ const j = await error.context.json(); msg = j.error || msg; }catch(e){} return toast('IA não respondeu: '+msg, 7000); }
  toast(data?.ok ? `IA pronta ✓ (${data.model})` : 'Resposta inesperada da função.', 5000);
}

    <div class="seg" style="grid-template-columns:repeat(3,1fr);margin-top:10px">${[['prev','vs. anterior'],['first','vs. primeiro'],['none','só este']].map(([k,v]) => `<button data-cmp="${k}" class="${ckCompare===k?'on':''}" style="font-size:12.5px">${v}</button>`).join('')}</div>

      <div class="ph tall mine"><img data-ck="${cur.id}" data-pose="${pose}" alt=""><span>${brShort(cur.date)}</span></div></div></div>`; }).join('')}
    ${ref ? '' : (idx === 0 && ckCompare !== 'none' ? '<p class="muted" style="font-size:12.5px">Este é o primeiro check-in: a comparação começa na próxima semana.</p>' : '')}
    </div>${aiCard(cur)}`;

const AI_PROG = {'avançando':['up','▲ Avançando'],'estável':['','■ Estável'],'regredindo':['down','▼ Regredindo'],'inconclusivo':['','? Inconclusivo']};

    <button class="btn-o w100" data-ai="${ck.id}" ${uid?'':'disabled'}>Analisar com IA</button></div>`;

    <b style="font-size:13px">Pontos a melhorar</b>${li(r.pontos_a_melhorar)}
    ${(r.grupos_prioritarios||[]).length ? `<p style="font-size:13px"><b>Priorizar:</b> ${r.grupos_prioritarios.map(m => `<span class="badge">${esc(m)}</span>`).join(' ')}</p>` : ''}
    <div class="note" style="margin:8px 0">${r.recomenda_trocar_ficha ? '🔁 <b>Recomenda trocar a ficha.</b> ' : '✓ <b>Manter a ficha por enquanto.</b> '}${esc(r.justificativa_troca||'')}</div>
    ${r.qualidade_fotos ? `<p class="muted" style="font-size:12px">📷 ${esc(r.qualidade_fotos)}</p>` : ''}
    <p class="muted" style="font-size:11px">Confiança: ${esc(r.confianca||'—')} · ${br(ck.ai.at)} · avaliação visual, não mede % de gordura.</p>

const STATUS_TXT = {progredindo:['up','▲ progredindo'], 'platô':['','■ platô'], regredindo:['down','▼ caindo'], novo:['','· poucos dados']};
function renderAnaliseTab(){
  const A = analysis();
  const V = {trocar:['🔁 Hora de trocar a ficha', 'var(--y)'], atencao:['⚠ Atenção: progresso desacelerando', '#e0a52a'], ok:['✓ Ficha funcionando — mantenha', 'var(--ok)'], dados:['· Poucos dados ainda', 'var(--mut)']}[A.verdict];
  let h = `<div class="card session"><h3 style="color:${V[1]}">${V[0]}</h3>
    ${A.reasons.length ? `<p class="muted" style="font-size:13px;margin:6px 0 0">Motivo: ${A.reasons.join('; ')}.</p>` : ''}
    <div class="grid3" style="margin-top:12px">
      <div class="stat"><small>Ganho/semana</small><b>${A.rate!=null?fmtKg(A.rate):'—'}<i> kg</i></b><em class="muted">${A.rateLo?`alvo ${fmtKg(A.rateLo)}–${fmtKg(A.rateHi)}`:'registre o peso'}</em></div>
      <div class="stat"><small>Frequência</small><b>${Math.round(A.adherence*100)}<i>%</i></b><em class="muted">4 semanas</em></div>
      <div class="stat"><small>Ficha atual</small><b>${A.planWeeks}<i> sem</i></b><em class="muted">desde ${brShort(planStart())}</em></div></div></div>`;
  if(A.good.length) h += `<div class="card"><h3 class="up">O que está indo bem</h3><ul style="padding-left:18px;line-height:1.55;margin:8px 0 0">${A.good.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if(A.warn.length) h += `<div class="card"><h3 style="color:#e0a52a">Pontos de atenção</h3><ul style="padding-left:18px;line-height:1.55;margin:8px 0 0">${A.warn.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h += `<div class="card"><h3>Progresso por exercício</h3><p class="muted" style="font-size:12px;margin:4px 0 8px">Compara a melhor série (carga × reps) das últimas 3 sessões com as anteriores.</p>
    <table class="t">${A.ex.map(x => `<tr><td>${esc(x.name)}</td><td style="text-align:right;white-space:nowrap" class="${STATUS_TXT[x.status][0]}">${STATUS_TXT[x.status][1]}</td></tr>`).join('')}</table></div>`;
  // proposta
  const pri = proposal ? proposal.priorities : A.priorities;
  h += `<div class="card" style="border-color:${A.verdict==='trocar'?'var(--y)':'var(--line)'}"><h3>Nova ficha</h3>
    <p class="muted" style="font-size:13px">O app monta uma ficha de hipertrofia mantendo sua divisão de 5 dias: troca a variação dos exercícios em platô, alterna a faixa de repetições do bloco, ajusta o volume semanal (10–20 séries diretas por músculo grande) e dá +1 série aos músculos prioritários. Nada muda sem a sua aprovação.</p>
    <label>Músculos prioritários</label><div class="chips" style="flex-wrap:wrap">${MUSCLES.map(m => `<button class="chip ${pri.includes(m)?'on':''}" data-pri="${m}">${m}</button>`).join('')}</div>
    <button class="btn-${A.verdict==='trocar'?'y':'o'} w100" id="genPlan" style="margin-top:10px">${proposal?'Gerar de novo':'Gerar proposta de nova ficha'}</button>`;
  if(proposal){
    const P = proposal;
    h += `<div style="margin-top:14px"><span class="badge solid">BLOCO ${P.block} · ${P.block==='A'?'compostos 6–10 reps / isolados 10–12':'compostos 8–12 reps / isolados 12–15'}</span>
      ${P.plans.map((p,d) => `<div style="margin-top:12px"><b class="head" style="font-size:16px">D${d+1} — ${esc(p.name)}</b>
        <table class="t">${P.changes.filter(c => c.day === d).map(c => `<tr><td>${c.from!==c.to?`<s class="muted">${esc(c.from)}</s><br><b style="color:var(--y)">${esc(c.to)}</b>`:esc(c.to)}${c.why.length?`<br><small>${esc(c.why.join(' · '))}</small>`:''}</td><td style="text-align:right;white-space:nowrap">${c.sets} × ${c.range[0]}–${c.range[1]}</td></tr>`).join('')}</table></div>`).join('')}
      <div style="margin-top:12px"><b style="font-size:13px">Séries por semana</b><div class="grid3" style="margin-top:6px">${MUSCLES.map(m => `<div class="stat" style="padding:8px"><small>${m}</small><b style="font-size:19px">${P.volume[m]}</b></div>`).join('')}</div></div>
      <div class="note" style="margin-top:12px">Dica: na 1ª semana da ficha nova, use cargas ~10% menores para aprender os movimentos (semana de adaptação).</div>
      <div class="grid2"><button class="btn-g" id="dropPlan">Descartar</button><button class="btn-y" id="okPlan">Aprovar ficha</button></div></div>`;
  }
  h += `</div>`;
  if((state.planHistory||[]).length) h += `<details class="how"><summary>Fichas anteriores (${state.planHistory.length})</summary>${[...state.planHistory].reverse().map(ph => `<p><b>${br(ph.date)}</b> — ${esc(ph.reason||'')}<br><small>${(ph.plans||[]).map(p => esc(p.name)).join(' · ')}</small></p>`).join('')}</details>`;
  return h;
}
function wireEvoExtra(){
  const root = $('evo');
  $('ckStart') && ($('ckStart').onclick = openCheckin);
  root.querySelectorAll('[data-ck-open]').forEach(b => b.onclick = () => { ckOpen = b.dataset.ckOpen; renderEvo(); });
  root.querySelectorAll('[data-cmp]').forEach(b => b.onclick = () => { ckCompare = b.dataset.cmp; renderEvo(); });
  root.querySelectorAll('[data-ai]').forEach(b => b.onclick = () => runAI(b.dataset.ai));
  root.querySelectorAll('[data-ck-del]').forEach(b => b.onclick = async () => {
    const ck = state.checkins.find(c => c.id === b.dataset.ckDel); if(!ck) return;
    if(!confirm(`Excluir o check-in de ${br(ck.date)} e as fotos dele? Vale para todos os aparelhos.`)) return;
    state.checkins = state.checkins.filter(c => c !== ck); state.deleted.checkins[ck.id] = Date.now(); ckOpen = null; save();
    for(const [pose] of POSES){ idbDel(ckKey(ck.id,pose)); }
    if(client && uid){ const paths = Object.values(ck.photos||{}).map(p => p.path).filter(Boolean); if(paths.length) client.storage.from(BUCKET).remove(paths).catch(()=>{}); }
    renderEvo(); toast('Check-in excluído.');
  });
  root.querySelectorAll('[data-pri]').forEach(b => b.onclick = () => {
    const base = proposal ? proposal.priorities : analysis().priorities;
    const set = new Set(base); set.has(b.dataset.pri) ? set.delete(b.dataset.pri) : set.add(b.dataset.pri);
    proposal = generatePlan([...set]); keepScroll(renderEvo);
  });
  $('genPlan') && ($('genPlan').onclick = () => { proposal = generatePlan(proposal ? proposal.priorities : analysis().priorities); keepScroll(renderEvo); });
  $('dropPlan') && ($('dropPlan').onclick = () => { proposal = null; keepScroll(renderEvo); });
  $('okPlan') && ($('okPlan').onclick = approveProposal);
  fillCkPhotos(root);
}
