const PLANS=[{"name": "Peito + Tríceps", "ex": [["Supino inclinado com halteres", 3, 8, 10], ["Supino reto na máquina", 3, 8, 10], ["Peck deck", 3, 10, 12], ["Supino inclinado na máquina", 2, 10, 12], ["Tríceps corda", 3, 10, 12], ["Tríceps polia alta com barra", 3, 10, 12]]}, {"name": "Costas + Bíceps", "ex": [["Puxada larga pronada", 3, 8, 10], ["Remada fechada neutra", 3, 8, 10], ["Remada posterior sentado", 3, 10, 12], ["Borboleta invertida", 3, 12, 15], ["Rosca Scott unilateral", 3, 8, 10], ["Rosca bíceps inclinado", 3, 10, 12], ["Rosca martelo", 3, 10, 12]]}, {"name": "Pernas A + Ombros", "ex": [["Agachamento hack ou Smith", 3, 6, 10], ["Leg press 45°", 3, 8, 12], ["Cadeira extensora", 3, 10, 15], ["Flexora sentada", 3, 10, 12], ["Desenvolvimento de ombros na máquina", 3, 8, 10], ["Elevação lateral com halteres", 3, 12, 15], ["Panturrilha em pé", 2, 12, 15]]}, {"name": "Superiores B", "ex": [["Supino inclinado com halteres", 3, 8, 10], ["Puxada larga pronada", 3, 8, 12], ["Remada articulada", 3, 8, 12], ["Elevação lateral com halteres", 2, 12, 15], ["Rosca direta barra EZ", 2, 10, 12], ["Tríceps polia alta com barra", 2, 10, 12]]}, {"name": "Pernas B + Abdômen", "ex": [["Stiff com halteres", 3, 8, 10], ["Flexora sentada", 3, 10, 12], ["Leg press 45°", 3, 10, 12], ["Elevação pélvica na máquina", 3, 8, 12], ["Panturrilha no leg press", 4, 10, 15], ["Abdômen máquina", 3, 12, 15]]}];const KEY='forca92.v5';const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const num=x=>Number(String(x||0).replace(',','.'))||0;const clone=x=>JSON.parse(JSON.stringify(x));const fresh=()=>({sessions:[],measurements:[],bodyScans:[],planHistory:[],drafts:{},library:[],plans:clone(PLANS),nextDay:0,planVersion:6});let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state){state=fresh();localStorage.setItem(KEY,JSON.stringify(state))}state.sessions||=[];state.measurements||=[];state.drafts||={};state.plans||=clone(PLANS);state.bodyScans||=[];state.planHistory||=[];if((state.planVersion||0)<6){state.planHistory.push({date:new Date().toISOString(),reason:'Atualização ficha V6, histórico preservado',plans:clone(state.plans),version:state.planVersion||5});state.plans=clone(PLANS);state.planVersion=6;localStorage.setItem(KEY,JSON.stringify(state))}let day=Math.min(4,Math.max(0,state.nextDay||0)),tab='train',client=null,uid=null,revision=0,dirty=false,syncBusy=false;let cfg={};try{cfg=JSON.parse(localStorage.getItem('forca92.cloud')||'{}')}catch(e){}function status(s){$('sync').textContent=s}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));dirty=true;status(client&&uid?'Pendente de envio':'Salvo neste dispositivo • sem nuvem');schedule()}catch(e){alert('Falha ao salvar neste navegador. Exporte um backup.')}}let debounce;function schedule(){clearTimeout(debounce);debounce=setTimeout(push,1100)}function merge(a,b){const out=clone(a);for(const field of ['sessions','measurements','bodyScans','planHistory']){const m=new Map();for(const item of [...(b[field]||[]),...(a[field]||[])])m.set(String(item.id??item.date+'|'+item.planName+'|'+item.finishedAt),item);out[field]=[...m.values()]}out.drafts={...(b.drafts||{}),...(a.drafts||{})};out.plans=a.plans||b.plans||PLANS;out.nextDay=a.nextDay??b.nextDay??0;return out}
async function connect(){if(!cfg.url||!cfg.key){status('Local • configure nuvem');return}if(!window.supabase){status('Biblioteca Supabase indisponível');return}client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await client.auth.getSession();if(session){uid=session.user.id;await pull()}else status('Nuvem • faça login')}
async function pull(){if(!client||!uid)return;status('Consultando nuvem…');const {data,error}=await client.from('forca92_state').select('payload,revision').eq('user_id',uid).maybeSingle();if(error){status('Erro na nuvem: '+error.message);return}revision=data?.revision||0;if(data?.payload&&Object.keys(data.payload).length){state=merge(state,data.payload);localStorage.setItem(KEY,JSON.stringify(state));dirty=true;render();await push()}else{dirty=true;await push()}}
async function push(){if(!dirty||!client||!uid||syncBusy)return;syncBusy=true;status('Enviando…');const snapshot=JSON.stringify(state);try{const {data,error}=await client.rpc('forca92_write',{expected_revision:revision,new_payload:JSON.parse(snapshot)});if(error){if(String(error.message).includes('REVISION_CONFLICT')){const res=await client.from('forca92_state').select('payload,revision').eq('user_id',uid).single();if(res.error)throw res.error;revision=res.data.revision;state=merge(state,res.data.payload);localStorage.setItem(KEY,JSON.stringify(state));dirty=true;status('Conflito mesclado • reenviando');}else throw error}else{revision=data;dirty=JSON.stringify(state)!==snapshot;status('Nuvem sincronizada ✓')}}catch(e){status('Pendente: '+e.message)}finally{syncBusy=false;if(dirty&&navigator.onLine&&revision>0)setTimeout(push,5000)}}
function draft(){const k=today()+'_'+day;if(!state.drafts[k]){state.drafts[k]={date:today(),day,ex:state.plans[day].ex.map(([name,count,min,max])=>({name,min,max,sets:Array.from({length:count},()=>({kg:'',reps:'',done:false}))}))};save()}return state.drafts[k]}
function renderTrain(){const d=draft();const total=d.ex.flatMap(e=>e.sets).length,done=d.ex.flatMap(e=>e.sets).filter(s=>s.done).length;$('train').innerHTML=`<div class="page-head"><div><h2>Seu treino</h2><small>FORÇA • PROGRESSÃO • DISCIPLINA</small></div><span class="day-badge">D${day+1} / D5</span></div><div class="day-strip">${state.plans.map((p,i)=>`<button class="day-chip ${i===day?'selected':''}" data-day="${i}">D${i+1}<small>${esc(p.name.split(' + ')[0].split(' ')[0])}</small></button>`).join('')}</div><div class="card session-info"><div class="row"><strong>Dia ${day+1} — ${esc(state.plans[day].name)}</strong><span class="pill">${done}/${total} séries</span></div><label>Data do treino</label><input id="sessiondate" type="date" value="${esc(d.date)}"><p class="muted">Preenchimento salvo automaticamente neste aparelho. Marque cada série concluída.</p></div><div class="exercise-list">${d.ex.map((e,i)=>`<article class="card exercise-card" id="ex-${i}"><div class="ex-num">EXERCÍCIO ${String(i+1).padStart(2,'0')}</div>${visualHeader(e.name,e.sets.length,e.min,e.max)}<div class="set-head"><span>SÉRIE</span><span>CARGA (KG)</span><span>REPS</span><span>FEITA</span></div>${e.sets.map((s,j)=>`<div class="set"><span class="set-number">${j+1}</span><div><input aria-label="Carga série ${j+1} ${esc(e.name)}" type="number" step="0.5" inputmode="decimal" data-i="${i}" data-j="${j}" data-f="kg" value="${esc(s.kg)}" placeholder="kg"></div><div><input aria-label="Repetições série ${j+1} ${esc(e.name)}" type="number" inputmode="numeric" data-i="${i}" data-j="${j}" data-f="reps" value="${esc(s.reps)}" placeholder="reps"></div><div><input aria-label="Concluir série ${j+1}" class="tick" type="checkbox" data-i="${i}" data-j="${j}" data-f="done" ${s.done?'checked':''}></div></div>`).join('')}<button type="button" class="outline addset" data-add="${i}">＋ Adicionar série</button>${i<d.ex.length-1?`<button type="button" class="next-ex" data-next="${i+1}">Próximo exercício →</button>`:''}</article>`).join('')}</div><div class="card finish-card"><div class="row"><strong>Concluir sessão</strong><span>${done} séries realizadas</span></div><button id="finish" class="primary-full">✓ Finalizar e registrar treino</button><small>O treino só avança depois de finalizar. Seus campos são salvos antes disso.</small></div>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;renderTrain()});$('sessiondate').onchange=e=>{d.date=e.target.value;save()};$('train').querySelectorAll('[data-f]').forEach(el=>{el.oninput=()=>{d.ex[+el.dataset.i].sets[+el.dataset.j][el.dataset.f]=el.dataset.f==='done'?el.checked:el.value;save()}});$('train').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{d.ex[+b.dataset.add].sets.push({kg:'',reps:'',done:false});save();renderTrain();document.getElementById('ex-'+b.dataset.add)?.scrollIntoView({block:'start'})});$('train').querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>document.getElementById('ex-'+b.dataset.next)?.scrollIntoView({behavior:'smooth',block:'start'}));wirePhotos($('train'));$('finish').onclick=()=>{const completed=d.ex.flatMap(e=>e.sets).filter(s=>s.done);if(!completed.length)return alert('Marque ao menos uma série concluída.');if(completed.some(s=>!num(s.reps)||s.kg===''||num(s.kg)<0))return alert('Preencha carga e repetições das séries concluídas.');const record={...clone(d),id:crypto.randomUUID(),planName:state.plans[day].name,finishedAt:new Date().toISOString(),planVersion:6};state.sessions.push(record);for(const k of Object.keys(state.drafts))if(state.drafts[k]===d)delete state.drafts[k];state.nextDay=(day+1)%5;day=state.nextDay;save();tab='history';render();alert('Treino salvo no dispositivo. Confira o status da nuvem no topo.')};}

function helpFor(name){return EX_HELP[name]||[exerciseCategory(name),'Movimento controlado, postura estável e amplitude confortável.']}
function photoSrc(name){return photoCache.get(name)||exerciseIcon(name)}
async function refreshPhotos(){const els=document.querySelectorAll('img[data-exphoto]');await Promise.all([...new Set([...els].map(e=>e.dataset.exphoto))].map(async name=>{if(!photoCache.has(name)){const x=await getPhoto(name);if(x)photoCache.set(name,x)}}));document.querySelectorAll('img[data-exphoto]').forEach(el=>{el.src=photoSrc(el.dataset.exphoto)})}
async function choosePhoto(name){if(!photoDB){alert('Seu navegador não disponibilizou o armazenamento de fotos.');return}const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;if(f.size>15*1024*1024)return alert('Selecione uma foto de até 15 MB.');try{const img=new Image();const u=URL.createObjectURL(f);await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=u});const max=650,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);const data=c.toDataURL('image/jpeg',0.78);await putPhoto(name,data);photoCache.set(name,data);await refreshPhotos();alert('Foto salva neste iPhone. Ela aparece na ficha e na biblioteca.')}catch(e){alert('Não foi possível salvar a foto: '+e.message)}};inp.click()}
function visualHeader(name,sets,min,max){const h=helpFor(name);return `<div class="exvisual"><img data-exphoto="${esc(name)}" src="${exerciseIcon(name)}" alt="Diagrama do exercício ${esc(name)}"><div><span class="muscle">${esc(h[0])}</span><strong>${esc(name)}</strong><small>${sets} séries × ${min}–${max} repetições</small><div class="photobar"><button class="photo-btn" type="button" data-photo="${esc(name)}">📷 Foto real</button></div></div></div><details class="exdetail"><summary>Como executar este movimento</summary><p>${esc(h[1])}</p></details>`}
function wirePhotos(scope){scope.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>choosePhoto(b.dataset.photo));refreshPhotos()}
openPhotoDB().then(refreshPhotos).catch(()=>{});

const LIB=[['Peito','Supino inclinado com halteres','incline dumbbell bench press'],['Peito','Supino reto na máquina','chest press machine'],['Peito','Peck deck','pec deck'],['Costas','Puxada larga pronada','lat pulldown'],['Costas','Remada fechada neutra','seated cable row'],['Costas','Remada articulada','chest supported row'],['Bíceps','Rosca Scott unilateral','preacher curl'],['Bíceps','Rosca bíceps inclinado','incline dumbbell curl'],['Bíceps','Rosca martelo','hammer curl'],['Tríceps','Tríceps corda','triceps rope pushdown'],['Tríceps','Tríceps polia alta com barra','triceps straight bar pushdown'],['Ombros','Desenvolvimento de ombros na máquina','shoulder press'],['Ombros','Elevação lateral com halteres','lateral raise'],['Pernas','Agachamento hack ou Smith','hack squat'],['Pernas','Leg press 45°','leg press'],['Pernas','Cadeira extensora','leg extension'],['Pernas','Flexora sentada','seated leg curl'],['Pernas','Stiff com halteres','romanian deadlift'],['Pernas','Elevação pélvica na máquina','hip thrust'],['Pernas','Panturrilha no leg press','calf press'],['Abdômen','Abdômen máquina','abdominal crunch machine']];function renderLibrary(){const groups=[...new Set(LIB.map(x=>x[0]))];$('library').innerHTML=`<div class="page-head"><h2>Exercícios</h2><span class="day-badge">BIBLIOTECA</span></div><div class="card"><label>Grupo muscular</label><select id="group"><option value="">Todos</option>${groups.map(g=>`<option>${g}</option>`).join('')}</select><label>Pesquisar</label><input id="search" placeholder="Nome do exercício"></div><div id="results" class="grid"></div><p class="muted">Diagramas de identificação e instruções por movimento. Para fotografias reais dos aparelhos da sua academia, toque em “Colocar foto”. As fotos ficam neste dispositivo.</p>`;const fill=()=>{$('results').innerHTML=LIB.filter(x=>(!$('group').value||x[0]===$('group').value)&&x[1].toLowerCase().includes($('search').value.toLowerCase())).map(x=>`<div class="libitem"><img data-exphoto="${esc(x[1])}" src="${exerciseIcon(x[1])}" alt="${esc(x[1])}"><strong>${esc(x[1])}</strong><p>${esc(x[0])} · ${esc(helpFor(x[1])[1])}</p><button type="button" class="photo-btn" data-photo="${esc(x[1])}">📷 Colocar foto</button></div>`).join('');wirePhotos($('library'))};$('group').onchange=fill;$('search').oninput=fill;fill()}
function renderHistory(){$('history').innerHTML=`<h2>Histórico preservado</h2>${[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="card"><div class="row"><strong>${esc(s.date)} — ${esc(s.planName||state.plans[s.day]?.name||'Treino')}</strong><span class="pill">${s.ex.flatMap(e=>e.sets).filter(x=>x.done).length} séries</span></div><details><summary>Ver cargas e repetições</summary>${s.ex.map(e=>`<p><strong>${esc(e.name)}</strong><br><small>${e.sets.filter(x=>x.done).map(x=>esc(x.kg)+' kg × '+esc(x.reps)).join(' · ')||'Não concluído'}</small></p>`).join('')}</details></div>`).join('')||'<div class="card">Sem registros</div>'}`}
function renderBody(){$('body').innerHTML=`<h2>Medidas e BodyScan</h2><div class="card"><strong>Meta corporal: 92 kg</strong><p class="muted">As referências das fotos do BodyScan foram preservadas no backup, mas as imagens precisam permanecer no armazenamento original.</p><form id="measure"><label>Data</label><input type="date" name="date" value="${today()}" required><div class="grid">${[['weight','Peso kg'],['waist','Cintura cm'],['chest','Peito cm'],['arm','Braço cm'],['thigh','Coxa cm'],['calf','Panturrilha cm']].map(([k,v])=>`<div><label>${v}</label><input type="number" step="0.1" name="${k}"></div>`).join('')}</div><button style="width:100%;margin-top:12px">Salvar medidas</button></form></div><div class="card"><h3>Histórico</h3>${[...state.measurements].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<p>${esc(m.date)} • ${m.weight??'—'} kg • cintura ${m.waist??'—'} cm</p>`).join('')}</div>`;$('measure').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),m={id:crypto.randomUUID(),date:f.get('date')};for(const k of ['weight','waist','chest','arm','thigh','calf'])m[k]=f.get(k)?num(f.get(k)):null;state.measurements.push(m);save();renderBody()}}
function exportJSON(){const blob=new Blob([JSON.stringify({app:'FORCA92',version:'6.0',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='FORCA92_V6_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}function renderSettings(){$('settings').innerHTML=`<h2>Nuvem e segurança</h2><div class="card notice">A sincronização só funciona depois de configurar o projeto Supabase, executar o SQL e entrar com seu usuário. Sem isso, o app salva apenas neste navegador.</div><div class="card"><h3>Conectar Supabase</h3><label>Project URL</label><input id="url" placeholder="https://SEU-PROJETO.supabase.co" value="${esc(cfg.url||'')}"><label>Chave pública publishable / anon</label><input id="key" value="${esc(cfg.key||'')}"><button id="config" style="width:100%;margin-top:10px">Salvar configuração</button><label>Email</label><input id="email" type="email" placeholder="Seu email"><label>Senha</label><input id="password" type="password"><div class="grid"><button id="login">Entrar</button><button id="signup" class="secondary">Criar conta</button></div><button id="logout" class="secondary" style="width:100%;margin-top:9px">Sair</button><p class="muted" id="account">${uid?'Conectado':'Não conectado'}</p></div><div class="card"><h3>Backup seguro</h3><button id="export" style="width:100%">Exportar JSON</button><label style="margin-top:12px">Importar backup (mesclagem, sem excluir registros)</label><input type="file" id="import" accept=".json,application/json"><p class="muted">Antes de importar, exporte o estado atual. A importação mescla sessões por identificador e mantém registros existentes.</p></div>`;$('config').onclick=()=>{cfg={url:$('url').value.trim(),key:$('key').value.trim()};localStorage.setItem('forca92.cloud',JSON.stringify(cfg));connect();alert('Configuração armazenada neste navegador.')};$('login').onclick=async()=>{if(!client)return alert('Configure o Supabase primeiro.');const {data,error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return alert(error.message);uid=data.user.id;await pull();renderSettings()};$('signup').onclick=async()=>{if(!client)return alert('Configure o Supabase primeiro.');const {error}=await client.auth.signUp({email:$('email').value,password:$('password').value});alert(error?error.message:'Conta solicitada. Confirme o email, se exigido pelo Supabase.')};$('logout').onclick=async()=>{await client?.auth.signOut();uid=null;status('Local • desconectado');renderSettings()};$('export').onclick=exportJSON;$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=JSON.parse(await f.text());if(b.app!=='FORCA92'||!b.data||!Array.isArray(b.data.sessions))throw Error('Arquivo inválido');if(!confirm('Mesclar backup com os registros existentes? Nenhum registro será apagado.'))return;const firstImport=state.sessions.length===0;state=merge(state,b.data);if(firstImport){state.plans=clone(PLANS);state.planVersion=5;const latest=[...state.sessions].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];state.nextDay=latest?((Number(latest.day)+1)%5):0;day=state.nextDay;}save();render();alert('Backup mesclado. Confira histórico e sincronização.')}catch(e){alert('Falha: '+e.message)}}}
function render(){for(const t of ['train','library','history','body','settings'])$(t).classList.toggle('hidden',t!==tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({train:renderTrain,library:renderLibrary,history:renderHistory,body:renderBody,settings:renderSettings})[tab]()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});window.addEventListener('online',()=>{status('Reconectado • verificando');if(client&&uid)pull()});window.addEventListener('visibilitychange',()=>{if(!document.hidden&&client&&uid)pull()});render();connect();
</script></body></html>
