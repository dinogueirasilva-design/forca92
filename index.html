async function connect(){if(!cfg.url||!cfg.key){status('Local • configure nuvem');return}if(!window.supabase){status('Biblioteca Supabase indisponível');return}client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await client.auth.getSession();if(session){uid=session.user.id;await pull()}else status('Nuvem • faça login')}

:5};state.sessions.push(record);delete state.drafts[today()+'_'+day];state.nextDay=(day+1)%5;day=state.nextDay;save();tab='history';render();alert('Treino salvo localmente. Confira no topo se a nuvem sincronizou.')};}
