<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101a22"><title>FORÇA92 V3.1 | Diário de Hipertrofia</title><style>:root{color-scheme:dark;--bg:#0d141a;--card:#18242d;--line:#30414c;--ink:#f0f6f7;--muted:#a4b6bd;--accent:#a7e36a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding-bottom:95px}header{padding:26px 18px 16px;background:linear-gradient(135deg,#20362e,#101b23)}h1{font-size:26px;margin:4px 0}h2{font-size:19px;margin:10px 0}h3{font-size:16px;margin:0 0 10px}.muted,small{color:var(--muted)}main{max-width:760px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.pill{display:inline-block;background:#314b38;color:#c5f5a1;padding:5px 10px;border-radius:30px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#22333b;padding:13px;border-radius:12px}.stat strong{display:block;font-size:23px;color:var(--accent)}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #53636c;background:#101a21;color:white;min-width:0}input[type=number]{width:100%}input[type=date]{width:100%}button{background:var(--accent);color:#102015;border:0;font-weight:750;cursor:pointer}button.secondary{background:#31444f;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions>*{flex:1}label{display:block;color:var(--muted);font-size:12px;margin:6px 0}.exercise{border-top:1px solid var(--line);padding:14px 0}.exercise:first-of-type{border-top:0}.exhead{display:flex;justify-content:space-between;gap:8px;align-items:center}.sets{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:end;margin:8px 0}.sets label{margin:0}.sets .setnum{align-self:center;color:var(--muted)}.sets input{padding:9px 6px}.check{display:flex;justify-content:center;align-items:center}.check input{width:21px;height:21px;accent-color:#a7e36a}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#142029;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.tabs{overflow-x:auto;scrollbar-width:thin}.tabs button{flex:0 0 auto;min-width:69px;background:none;color:var(--muted);font-size:12px;padding:9px 3px}.tabs button.active{color:var(--accent);background:#273e34}.hidden{display:none}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row>*{min-width:0}.bar{height:9px;background:#30414c;border-radius:8px;overflow:hidden;margin:5px 0 13px}.bar span{display:block;height:100%;background:var(--accent)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}.danger{color:#ffb4a9}.good{color:var(--accent)}.hint{font-size:12px;color:var(--muted);line-height:1.5}svg{max-width:100%;height:auto}input[type=file]{font-size:12px;width:100%}</style></head><body><header><span class="pill">DIÁRIO DE HIPERTROFIA</span><h1>FORÇA <span style="color:var(--accent)">92</span></h1><div class="muted">V3.1 · Treinos, evolução e gestão da ficha</div></header><main><section id="train"></section><section id="analysis" class="hidden"></section><section id="progress" class="hidden"></section><section id="history" class="hidden"></section><section id="plans" class="hidden"></section><section id="body" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs" id="nav"></nav><script>
'use strict';
const defaultWorkouts=[{name:'Peito + Tríceps',ex:[['Supino inclinado com halteres',3,8,10],['Supino reto na máquina',3,8,10],['Peck deck',3,10,12],['Supino inclinado na máquina',2,10,12],['Tríceps corda',3,10,12],['Tríceps acima da cabeça na polia',3,10,12]]},{name:'Costas + Bíceps',ex:[['Puxada larga pronada',3,8,10],['Remada fechada neutra',3,8,10],['Remada posterior sentado',3,10,12],['Borboleta invertida',3,12,15],['Rosca Scott unilateral',3,8,10],['Rosca bíceps inclinado',3,10,12],['Rosca martelo',3,10,12]]},{name:'Pernas + Ombros',ex:[['Leg press postura estreita',4,8,12],['Cadeira extensora',3,10,12],['Flexora sentada',3,10,12],['Desenvolvimento de ombros na máquina',3,8,10],['Elevação lateral com halteres',3,12,15],['Borboleta invertida',3,12,15],['Panturrilha em pé',2,12,15]]},{name:'Superiores completo',ex:[['Supino inclinado na máquina',2,10,12],['Puxada larga pronada',2,10,12],['Remada neutra',2,10,12],['Elevação lateral',3,12,15],['Tríceps corda',2,10,12],['Rosca direta barra EZ',3,10,12]]},{name:'Pernas + Abdômen',ex:[['Flexora sentada',4,10,12],['Leg press',3,10,12],['Cadeira extensora',3,12,15],['Panturrilha no leg press',3,12,15],['Elevação de joelhos',3,12,15],['Hiperextensão lombar',3,10,12]]}];
let workouts=JSON.parse(JSON.stringify(defaultWorkouts));
const KEY='forca92.v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{sessions:[],measurements:[],drafts:{}}}catch(e){data={sessions:[],measurements:[],drafts:{}}}data.sessions||=[];data.measurements||=[];data.drafts||={};data.plans=Array.isArray(data.plans)&&data.plans.length?data.plans:JSON.parse(JSON.stringify(defaultWorkouts));data.planHistory||=[];data.planVersion=Number.isInteger(data.planVersion)?data.planVersion:1;workouts=data.plans;data.nextDay=Number.isInteger(data.nextDay)?data.nextDay:((data.sessions.length?((data.sessions.at(-1).day+1)%workouts.length):0));let day=data.nextDay,tab='train';const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let db=null;function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(Error('IndexedDB indisponível'));return}let req=indexedDB.open('FORCA92_DB',1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}function readDB(){return new Promise((resolve,reject)=>{let req=db.transaction('state','readonly').objectStore('state').get('main');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}function writeDB(){if(!db)return;try{let tx=db.transaction('state','readwrite');tx.objectStore('state').put(JSON.parse(JSON.stringify(data)),'main');tx.onerror=()=>console.warn('Falha ao salvar IndexedDB')}catch(e){console.warn(e)}}function save(){writeDB();try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Cópia localStorage indisponível')}}function num(x){let n=Number(String(x).replace(',','.'));return Number.isFinite(n)?n:0}function dateOf(s){return new Date(s+'T12:00:00')}function weekStart(s){let d=dateOf(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.toISOString().slice(0,10)}function volume(session){return session.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.done?num(s.kg)*num(s.reps):0),0),0)}function completed(session){return session.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}function draft(){let k=today()+'_'+day+'_v'+data.planVersion;if(!data.drafts[k])data.drafts[k]={date:today(),day,ex:workouts[day].ex.map(([name,count,min,max])=>({name,min,max,sets:Array.from({length:count},()=>({kg:'',reps:'',done:false}))}))};return data.drafts[k]}function renderTrain(){let d=draft();$('train').innerHTML=`<div class="card"><label>Selecione o dia da ficha</label><select id="daypick" style="width:100%">${workouts.map((w,i)=>`<option value="${i}" ${i===day?'selected':''}>Dia ${i+1} — ${esc(w.name)}</option>`).join('')}</select><p class="hint">Preencha carga e repetições realizadas em cada série. Marque ✓ ao concluir. O rascunho é salvo automaticamente.</p></div><div class="card"><div class="row"><h2>Dia ${day+1} · ${esc(workouts[day].name)}</h2><span class="pill">${d.ex.reduce((n,e)=>n+e.sets.length,0)} séries</span></div>${d.ex.map((e,i)=>`<div class="exercise"><div class="exhead"><strong>${i+1}. ${esc(e.name)}</strong><small>${e.sets.length} × ${e.min}–${e.max}</small></div>${e.sets.map((s,j)=>`<div class="sets"><div class="setnum">${j+1}ª</div><div><label>kg</label><input type="number" inputmode="decimal" step="0.5" min="0" data-e="${i}" data-s="${j}" data-field="kg" value="${esc(s.kg)}" placeholder="kg"></div><div><label>reps</label><input type="number" inputmode="numeric" min="0" max="100" data-e="${i}" data-s="${j}" data-field="reps" value="${esc(s.reps)}" placeholder="reps"></div><div class="check"><input type="checkbox" aria-label="Concluída" data-e="${i}" data-s="${j}" data-field="done" ${s.done?'checked':''}></div></div>`).join('')}</div>`).join('')}<button id="finish" style="width:100%">Finalizar e salvar treino</button></div>`;$('daypick').disabled=true;$('train').querySelectorAll('[data-field]').forEach(el=>{el.addEventListener('change',()=>{let s=d.ex[+el.dataset.e].sets[+el.dataset.s];s[el.dataset.field]=el.dataset.field==='done'?el.checked:el.value;save()})});$('finish').onclick=()=>{let sets=d.ex.flatMap(e=>e.sets).filter(s=>s.done);if(!sets.length){alert('Marque ao menos uma série concluída.');return}if(sets.some(s=>!num(s.reps)||s.kg===''||num(s.kg)<0)){alert('Preencha carga e repetições de todas as séries marcadas. Use 0 kg para exercícios com peso corporal.');return}data.sessions.push(JSON.parse(JSON.stringify({...d,id:Date.now(),finishedAt:new Date().toISOString(),planVersion:data.planVersion,planName:workouts[day].name})));delete data.drafts[today()+'_'+day+'_v'+data.planVersion];data.nextDay=(day+1)%workouts.length;day=data.nextDay;save();alert('Treino registrado!');tab='analysis';render()}}function aggregate(week){let ss=data.sessions.filter(s=>weekStart(s.date)===week),sets=ss.reduce((a,s)=>a+completed(s),0),vol=ss.reduce((a,s)=>a+volume(s),0);return {ss,sets,vol}}function fmt(n){return Math.round(n).toLocaleString('pt-BR')}function renderAnalysis(){let current=weekStart(today()),prevD=dateOf(current);prevD.setDate(prevD.getDate()-7);let prev=prevD.toISOString().slice(0,10),a=aggregate(current),b=aggregate(prev),diff=(x,y)=>y?((x-y)/y*100).toFixed(1)+'%':'sem base';let names=[...new Set(data.sessions.flatMap(s=>s.ex.map(e=>e.name)))];let progress=names.map(name=>{let get=w=>{let arr=data.sessions.filter(s=>weekStart(s.date)===w).flatMap(s=>s.ex.filter(e=>e.name===name).flatMap(e=>e.sets.filter(x=>x.done&&num(x.reps)>0).map(x=>({kg:num(x.kg),reps:num(x.reps)}))));return arr.length?Math.max(...arr.map(x=>x.kg)):null};return {name,now:get(current),old:get(prev)}}).filter(x=>x.now!==null||x.old!==null);$('analysis').innerHTML=`<h2>Análise semanal</h2><p class="muted">Semana iniciada em ${current.split('-').reverse().join('/')}</p><div class="grid"><div class="stat"><small>Treinos realizados</small><strong>${a.ss.length}</strong><small>Anterior: ${b.ss.length}</small></div><div class="stat"><small>Séries concluídas</small><strong>${a.sets}</strong><small>${diff(a.sets,b.sets)} vs. anterior</small></div><div class="stat"><small>Volume movimentado</small><strong>${fmt(a.vol)} kg</strong><small>${diff(a.vol,b.vol)} vs. anterior</small></div><div class="stat"><small>Frequência da ficha</small><strong>${Math.min(a.ss.length,workouts.length)}/${workouts.length}</strong><small>Treinos nesta semana</small></div></div><div class="card"><h3>Carga máxima registrada por exercício</h3><p class="hint">Comparação entre semanas. A carga máxima isolada não mede sozinha o progresso: considere também repetições, técnica e esforço.</p>${progress.length?`<table><thead><tr><th>Exercício</th><th>Anterior</th><th>Atual</th></tr></thead><tbody>${progress.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.old===null?'—':x.old+' kg'}</td><td class="${x.old!==null&&x.now>x.old?'good':''}">${x.now===null?'—':x.now+' kg'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Registre treinos para visualizar a comparação.</p>'}</div><div class="card"><h3>Volume das últimas 6 semanas</h3>${Array.from({length:6},(_,i)=>{let d=dateOf(current);d.setDate(d.getDate()-(5-i)*7);return d.toISOString().slice(0,10)}).map(w=>{let v=aggregate(w).vol,max=Math.max(1,...Array.from({length:6},(_,i)=>{let d=dateOf(current);d.setDate(d.getDate()-i*7);return aggregate(d.toISOString().slice(0,10)).vol}));return `<div class="row"><small>${w.slice(5).split('-').reverse().join('/')}</small><small>${fmt(v)} kg</small></div><div class="bar"><span style="width:${100*v/max}%"></span></div>`}).join('')}<p class="hint">O volume é calculado como carga × repetições das séries concluídas. Não compare diretamente aparelhos diferentes nem interprete volume maior como hipertrofia garantida.</p></div>`}function renderHistory(){$('history').innerHTML='<h2>Histórico de treinos</h2>'+(data.sessions.length?[...data.sessions].reverse().map(s=>`<div class="card"><div class="row"><div><strong>${s.date.split('-').reverse().join('/')} · ${esc(s.planName||workouts[s.day]?.name||'Treino')}</strong><p class="muted">${completed(s)} séries · ${fmt(volume(s))} kg movimentados</p></div><button class="secondary" data-delete="${s.id}">Excluir</button></div><details><summary>Ver exercícios e cargas</summary>${s.ex.map(e=>`<p><strong>${esc(e.name)}</strong><br><small>${e.sets.filter(x=>x.done).map(x=>`${esc(x.kg)} kg × ${esc(x.reps)}`).join(' | ')||'Não realizado'}</small></p>`).join('')}</details></div>`).join(''):'<div class="card">Nenhum treino registrado ainda.</div>');$('history').querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{if(confirm('Excluir este treino permanentemente?')){data.sessions=data.sessions.filter(s=>String(s.id)!==el.dataset.delete);save();renderHistory()}})}function renderBody(){let last=data.measurements.at(-1);$('body').innerHTML=`<h2>Medidas e meta corporal</h2><div class="card"><span class="pill">META 92 KG</span><p class="hint">Referência de setembro: 87,6 kg e cintura de 95 cm. Acompanhe tendência, não apenas o peso.</p><form id="measure"><label>Data</label><input name="date" type="date" required value="${today()}"><div class="grid">${[['weight','Peso (kg)'],['waist','Cintura (cm)'],['chest','Peitoral (cm)'],['arm','Braço (cm)']].map(([k,l])=>`<div><label>${l}</label><input name="${k}" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Opcional"></div>`).join('')}</div><button style="width:100%;margin-top:12px">Salvar avaliação</button></form></div><div class="card"><h3>Evolução</h3>${last?`<p>Último peso: <strong>${last.weight||'—'} kg</strong> · Cintura: <strong>${last.waist||'—'} cm</strong></p>`:''}<table><tr><th>Data</th><th>Peso</th><th>Cintura</th><th>Peito</th><th>Braço</th></tr>${[...data.measurements].reverse().map(m=>`<tr><td>${m.date.slice(5).split('-').reverse().join('/')}</td><td>${m.weight||'—'}</td><td>${m.waist||'—'}</td><td>${m.chest||'—'}</td><td>${m.arm||'—'}</td></tr>`).join('')}</table></div>`;$('measure').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),m={date:fd.get('date')};['weight','waist','chest','arm'].forEach(k=>m[k]=fd.get(k)?num(fd.get(k)):null);if(!Object.values(m).slice(1).some(x=>x!==null)){alert('Informe ao menos uma medida.');return}data.measurements.push(m);data.measurements.sort((a,b)=>a.date.localeCompare(b.date));save();renderBody()}}function renderSettings(){$('settings').innerHTML=`<h2>Backup e informações</h2><div class="card"><h3>Seus dados ficam neste navegador</h3><p class="hint">O app funciona offline depois de aberto como arquivo local, mas o armazenamento do Safari pode ser apagado ou ficar isolado dependendo de como o HTML foi aberto. Faça backups regularmente. Para instalação confiável na Tela de Início e sincronização, hospede como PWA com HTTPS e banco de dados.</p><div class="actions"><button id="export">Exportar backup JSON</button><label class="secondary" style="background:#31444f;padding:10px;border-radius:9px;text-align:center;color:white;flex:1;cursor:pointer">Importar backup<input id="import" type="file" accept="application/json,.json" style="display:none"></label></div><button id="clear" class="secondary" style="width:100%">Apagar todos os registros</button></div><div class="card"><h3>Orientação</h3><p class="hint">Mantenha 1–3 repetições de reserva na maioria das séries. Aumente carga somente quando alcançar a faixa superior com boa técnica. Não é uma avaliação médica ou prescrição individualizada.</p></div>`;$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'FORCA92',version:'3.1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forca92-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.data||!Array.isArray(obj.data.sessions)||!Array.isArray(obj.data.measurements))throw Error('Formato inválido');if(confirm('Substituir todos os dados atuais pelos do backup?')){data={sessions:obj.data.sessions,measurements:obj.data.measurements,drafts:obj.data.drafts||{},plans:obj.data.plans||JSON.parse(JSON.stringify(defaultWorkouts)),planHistory:obj.data.planHistory||[],planVersion:obj.data.planVersion||1,nextDay:Number.isInteger(obj.data.nextDay)?obj.data.nextDay:0};day=data.nextDay;workouts=data.plans;save();render()}}catch(err){alert('Backup inválido: '+err.message)}};$('clear').onclick=()=>{if(confirm('Apagar TODOS os treinos e medidas? Faça um backup antes.')){data={sessions:[],measurements:[],drafts:{},nextDay:0,plans:JSON.parse(JSON.stringify(defaultWorkouts)),planHistory:[],planVersion:1};workouts=data.plans;day=0;save();render()}}}function renderProgress(){
const ms=[...data.measurements].filter(m=>num(m.weight)>0).sort((a,b)=>a.date.localeCompare(b.date));
const recent=ms.slice(-4),avg=recent.length?recent.reduce((a,m)=>a+num(m.weight),0)/recent.length:null;
const start=ms.length?num(ms[0].weight):null,last=ms.length?num(ms.at(-1).weight):null;
const delta=start!==null?(last-start):null;
const fmtKg=x=>x===null?'—':x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})+' kg';
const muscleNames=['Peito','Tríceps','Costas','Bíceps','Pernas','Ombros','Abdômen','Panturrilha'];
const muscleMap=[['Peito','Tríceps'],['Costas','Bíceps'],['Pernas','Ombros','Panturrilha'],['Peito','Costas','Ombros','Tríceps','Bíceps'],['Pernas','Abdômen','Panturrilha']];
const rows=muscleNames.map(m=>{const ss=data.sessions.filter(s=>muscleMap[s.day]?.includes(m)&&completed(s)>0);const last=ss.length?ss.at(-1).date:null;const days=last?Math.round((dateOf(today())-dateOf(last))/86400000):null;return `<tr><td>${m}</td><td>${ss.length}</td><td>${last?last.split('-').reverse().join('/'):'—'}</td><td>${days===null?'—':days+' dias'}</td></tr>`}).join('');
const weekWeights=ms.map(m=>`<tr><td>${m.date.split('-').reverse().join('/')}</td><td>${fmtKg(num(m.weight))}</td></tr>`).reverse().join('');
$('progress').innerHTML=`<h2>Evolução corporal e muscular</h2><div class="grid"><div class="stat"><small>Último peso</small><strong>${fmtKg(last)}</strong></div><div class="stat"><small>Média últimas 4 pesagens</small><strong>${fmtKg(avg)}</strong></div><div class="stat"><small>Variação acumulada</small><strong>${delta===null?'—':(delta>=0?'+':'')+fmtKg(delta)}</strong></div><div class="stat"><small>Pesagens registradas</small><strong>${ms.length}</strong></div></div><div class="card"><h3>Histórico de pesagens</h3><p class="hint">Registre seu peso em Medidas. A média usa as últimas quatro pesagens disponíveis, não valores inventados.</p>${ms.length?`<table><thead><tr><th>Data</th><th>Peso</th></tr></thead><tbody>${weekWeights}</tbody></table>`:'Nenhuma pesagem registrada.'}</div><div class="card"><h3>Frequência por grupo muscular</h3><p class="hint">Grupos estimados a partir da ficha finalizada; para análise por exercício específico, use o histórico de séries.</p><table><thead><tr><th>Grupo</th><th>Sessões</th><th>Último</th><th>Intervalo</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card"><h3>Pesagem semanal</h3><p>Registre uma vez a cada 7 dias, de preferência pela manhã, nas mesmas condições. As medidas corporais podem ser registradas mensalmente.</p><button id="goBody">Registrar peso e medidas</button></div>`;
$('goBody').onclick=()=>{tab='body';render()};
}

const muscleTags=['Peito','Tríceps','Costas','Bíceps','Pernas','Ombros','Panturrilha','Abdômen'];
const exerciseOptions={
'Peito':['Supino reto com halteres','Supino inclinado com halteres','Supino reto na máquina','Supino inclinado na máquina','Peck deck','Crucifixo com halteres','Flexão de braços'],
'Tríceps':['Tríceps corda','Tríceps francês com halter','Tríceps testa','Tríceps acima da cabeça na polia','Tríceps na máquina'],
'Costas':['Puxada larga pronada','Puxada neutra','Remada baixa','Remada unilateral com halter','Remada articulada','Remada fechada neutra'],
'Bíceps':['Rosca direta barra EZ','Rosca alternada','Rosca Scott unilateral','Rosca martelo','Rosca bíceps inclinado'],
'Pernas':['Agachamento guiado','Leg press','Cadeira extensora','Flexora sentada','Mesa flexora','Afundo com halteres','Cadeira abdutora'],
'Ombros':['Desenvolvimento de ombros na máquina','Desenvolvimento com halteres','Elevação lateral com halteres','Borboleta invertida','Elevação frontal'],
'Panturrilha':['Panturrilha em pé','Panturrilha sentado','Panturrilha no leg press'],
'Abdômen':['Prancha','Elevação de joelhos','Abdominal na máquina','Crunch']};
function muscleFor(name){let n=String(name).toLowerCase();if(/tríceps|triceps/.test(n))return 'Tríceps';if(/rosca|bíceps|biceps/.test(n))return 'Bíceps';if(/panturrilha/.test(n))return 'Panturrilha';if(/abd[oô]m|prancha|crunch|elevação de joelhos/.test(n))return 'Abdômen';if(/supino|peck|crucifixo|flexão de braços/.test(n))return 'Peito';if(/remada|puxada|pulldown|barra fixa/.test(n))return 'Costas';if(/ombro|elevação lateral|elevação frontal|borboleta invertida|desenvolvimento/.test(n))return 'Ombros';if(/perna|leg press|extensora|flexora|agachamento|afundo|abdutora|hiperextensão/.test(n))return 'Pernas';return 'Outro'}
function smartSuggestions(){let out=[];let all=new Map();for(let ss of data.sessions){for(let e of ss.ex){let arr=e.sets.filter(x=>x.done&&num(x.reps)>0).map(x=>({kg:num(x.kg),reps:num(x.reps)}));if(!arr.length)continue;let name=e.name;if(!all.has(name))all.set(name,[]);all.get(name).push({date:ss.date,weight:Math.max(...arr.map(x=>x.kg)),reps:arr.reduce((a,x)=>a+x.reps,0)/arr.length,volume:arr.reduce((a,x)=>a+x.kg*x.reps,0)});}}
for(let [name,ss] of all){if(ss.length<3)continue;let recent=ss.slice(-3);let first=recent[0],last=recent.at(-1);let group=muscleFor(name);let alternatives=(exerciseOptions[group]||[]).filter(x=>x!==name);if(last.weight>first.weight||last.reps>first.reps+1){out.push({name,kind:'progress',text:'Progressão observada nas últimas 3 sessões. Considere manter o exercício e ajustar gradualmente carga ou repetições com boa técnica.',alternatives});}else if(last.weight<=first.weight&&last.reps<=first.reps+1){out.push({name,kind:'review',text:'Pouca progressão nas últimas 3 sessões. Revise recuperação, técnica e esforço; se fizer sentido, teste uma variação.',alternatives});}}
return out;}
function renderPlans(){let suggestions=smartSuggestions();let groups=Object.keys(exerciseOptions);$('plans').innerHTML=`<h2>Gestão da ficha</h2><div class="card"><span class="pill">FICHA V${data.planVersion}</span><p class="hint">Você controla as mudanças. Sugestões são indicativas e não alteram sua ficha sem confirmação. Treinos antigos permanecem no histórico.</p><label>Escolha o treino para editar</label><select id="planPick" style="width:100%">${workouts.map((w,i)=>`<option value="${i}">Dia ${i+1} — ${esc(w.name)}</option>`).join('')}</select><div id="planEditor"></div></div><div class="card"><h3>Sugestões de evolução</h3><p class="hint">A análise precisa de pelo menos três sessões registradas por exercício. Compare também técnica, descanso e esforço.</p>${suggestions.length?suggestions.map((x,i)=>`<div class="exercise"><strong>${esc(x.name)}</strong><p class="hint">${esc(x.text)}</p>${x.alternatives.length?`<label>Alternativa possível</label><select id="suggestAlt${i}">${x.alternatives.map(y=>`<option>${esc(y)}</option>`).join('')}</select><button class="secondary" data-suggest="${i}">Usar alternativa na ficha</button>`:''}</div>`).join(''):'Ainda não há sessões suficientes para sugestões individualizadas. Você já pode editar sua ficha manualmente.'}</div><div class="card"><h3>Versões anteriores</h3>${data.planHistory.length?[...data.planHistory].reverse().map(v=>`<p class="hint">Versão ${v.version} · ${esc(v.date)} · ${esc(v.reason)}</p>`).join(''):'Nenhuma alteração realizada ainda.'}</div>`;
let pick=$('planPick');let editDraft=JSON.parse(JSON.stringify(workouts[+pick.value]));function editor(){let i=+pick.value,w=editDraft;$('planEditor').innerHTML=`<label>Nome do treino</label><input id="planName" style="width:100%" value="${esc(w.name)}"><h3 style="margin-top:14px">Exercícios</h3>${w.ex.map((e,j)=>`<div class="exercise"><div class="row"><strong>${j+1}. ${esc(e[0])}</strong><button class="secondary" data-remove="${j}">Excluir</button></div><label>Exercício</label><input style="width:100%" data-name="${j}" value="${esc(e[0])}" list="exerciseCatalog"><div class="grid"><div><label>Séries</label><input type="number" min="1" max="12" data-count="${j}" value="${e[1]}"></div><div><label>Repetições mínimas</label><input type="number" min="1" max="50" data-min="${j}" value="${e[2]}"></div><div><label>Repetições máximas</label><input type="number" min="1" max="50" data-max="${j}" value="${e[3]}"></div><div><label>Ordem</label><div class="actions"><button class="secondary" data-up="${j}" ${j===0?'disabled':''}>↑</button><button class="secondary" data-down="${j}" ${j===w.ex.length-1?'disabled':''}>↓</button></div></div></div></div>`).join('')}<datalist id="exerciseCatalog">${groups.flatMap(g=>exerciseOptions[g]).map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist><div class="card"><label>Grupo muscular para adicionar exercício</label><select id="addGroup" style="width:100%">${groups.map(g=>`<option value="${esc(g)}" ${muscleFor(w.ex[0]?.[0]||'')===g?'selected':''}>${esc(g)}</option>`).join('')}</select><label>Exercícios disponíveis</label><select id="addChoice" style="width:100%"></select><div class="actions"><button class="secondary" id="addExercise">+ Adicionar exercício selecionado</button><button id="savePlan">Salvar alterações</button></div></div><p class="hint">A ficha ativa só muda ao salvar. O treino em andamento será reiniciado para refletir os exercícios atualizados; séries não finalizadas não serão transferidas.</p>`;
function readForm(){let name=$('planName').value.trim();let ex=w.ex.map((e,j)=>[document.querySelector(`[data-name="${j}"]`).value.trim(),+document.querySelector(`[data-count="${j}"]`).value,+document.querySelector(`[data-min="${j}"]`).value,+document.querySelector(`[data-max="${j}"]`).value]);return {name,ex}}
function validate(obj){return obj.name&&obj.ex.length>0&&obj.ex.every(e=>e[0]&&Number.isInteger(e[1])&&e[1]>=1&&e[1]<=12&&Number.isInteger(e[2])&&e[2]>=1&&Number.isInteger(e[3])&&e[3]>=e[2]&&e[3]<=50)}
function commit(next,reason){if(!validate(next)){alert('Confira o nome, exercícios, séries e faixas de repetições.');return}if(!confirm('Salvar a nova ficha? Os treinos concluídos serão preservados; rascunhos ainda não finalizados serão descartados.'))return;data.planHistory.push({version:data.planVersion,date:new Date().toLocaleString('pt-BR'),reason,plans:JSON.parse(JSON.stringify(workouts))});data.plans[i]=next;data.planVersion++;data.drafts={};workouts=data.plans;save();renderPlans();alert('Ficha atualizada! Histórico preservado.');}
$('savePlan').onclick=()=>commit(readForm(),'Edição manual do treino '+(i+1));function refreshChoices(){let g=$('addGroup').value;$('addChoice').innerHTML=(exerciseOptions[g]||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')};$('addGroup').onchange=refreshChoices;refreshChoices();$('addExercise').onclick=()=>{let o=readForm();let choice=$('addChoice').value;if(!choice){alert('Escolha um exercício.');return}o.ex.push([choice,3,8,12]);editDraft=o;editor()};$('planEditor').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let o=readForm();if(o.ex.length<=1){alert('Mantenha pelo menos um exercício.');return}o.ex.splice(+b.dataset.remove,1);editDraft=o;editor()});for(let dir of ['up','down'])$('planEditor').querySelectorAll(`[data-${dir}]`).forEach(b=>b.onclick=()=>{let o=readForm(),j=+b.dataset[dir],k=j+(dir==='up'?-1:1);[o.ex[j],o.ex[k]]=[o.ex[k],o.ex[j]];editDraft=o;editor()});}pick.onchange=()=>{editDraft=JSON.parse(JSON.stringify(workouts[+pick.value]));editor()};editor();$('plans').querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>{let x=suggestions[+b.dataset.suggest],newName=$('suggestAlt'+b.dataset.suggest).value;let i=workouts.findIndex(w=>w.ex.some(e=>e[0]===x.name));if(i<0){alert('Exercício não encontrado na ficha atual.');return}if(!confirm(`Substituir ${x.name} por ${newName}?`))return;data.planHistory.push({version:data.planVersion,date:new Date().toLocaleString('pt-BR'),reason:'Sugestão aceita: '+x.name,plans:JSON.parse(JSON.stringify(workouts))});data.plans[i].ex=data.plans[i].ex.map(e=>e[0]===x.name?[newName,e[1],e[2],e[3]]:e);data.planVersion++;data.drafts={};workouts=data.plans;save();renderPlans()});}

const tabs=[['train','Treinar'],['analysis','Análise'],['progress','Evolução'],['history','Histórico'],['plans','Ficha'],['body','Medidas'],['settings','Backup']];function render(){$('nav').innerHTML=tabs.map(([id,name])=>`<button data-tab="${id}" class="${id===tab?'active':''}">${name}</button>`).join('');tabs.forEach(([id])=>$(id).classList.toggle('hidden',id!==tab));$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});({train:renderTrain,analysis:renderAnalysis,progress:renderProgress,history:renderHistory,plans:renderPlans,body:renderBody,settings:renderSettings})[tab]()}render();openDB().then(async d=>{db=d;let saved=await readDB();if(saved&&Array.isArray(saved.sessions)){data=saved;data.sessions||=[];data.measurements||=[];data.drafts||={};data.plans=Array.isArray(data.plans)&&data.plans.length?data.plans:JSON.parse(JSON.stringify(defaultWorkouts));data.planHistory||=[];data.planVersion=Number.isInteger(data.planVersion)?data.planVersion:1;workouts=data.plans;data.nextDay=Number.isInteger(data.nextDay)?data.nextDay:(data.sessions.length?(data.sessions.at(-1).day+1)%workouts.length:0);day=data.nextDay;render()}else{writeDB()}}).catch(e=>console.warn('Banco local indisponível, usando armazenamento alternativo:',e));
</script></body></html>
